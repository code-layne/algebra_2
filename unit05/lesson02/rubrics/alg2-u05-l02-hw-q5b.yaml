# Rubric for homework item 5(b), simplest form under a cube root (Unit 5, Lesson 5.2).
id: q5b
points: 2
task: >-
  Explain why the cube root of 16 is not in simplest form but the cube root of
  9 is, even though 9 is a perfect square.
criteria:
  - id: sixteen
    points: 1
    full: >-
      Under a cube root only perfect cubes come out; 16 = 8 * 2 contains the
      perfect cube 8, so cbrt(16) = 2 cbrt(2) is not finished.
  - id: nine
    points: 1
    full: >-
      9 = 3 * 3 has no perfect-cube factor (it would need three equal
      factors), so cbrt(9) is already simplest; being a perfect square does
      not matter because the index decides.
examples:
  - response: >-
      16 has 8 in it which is a cube so it becomes 2cbrt(2). 9 only has two
      3s, you need three for a cube root.
    scores: {sixteen: 1, nine: 1}
  - response: "9 is a perfect square so it should simplify to 3."
    scores: {sixteen: 0, nine: 0}
