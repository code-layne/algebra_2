# Rubric for homework item 6(c), why the two simplification methods agree (Unit 5, Lesson 5.2).
id: q6c
points: 2
task: >-
  sqrt(x^9) was simplified two ways: by splitting the radicand
  (sqrt(x^8 * x)) and with a rational exponent (x^(9/2) = x^4 * x^(1/2)).
  Why do these two methods always agree? Use the words mixed number.
criteria:
  - id: mixed
    points: 1
    full: >-
      Says dividing the exponent by the index is rewriting the improper
      fraction 9/2 as the mixed number 4 1/2.
  - id: parts
    points: 1
    full: >-
      Explains the parts: the whole number 4 is the power that comes outside
      (x^4), and the leftover 1/2 is one square root that stays inside.
examples:
  - response: >-
      9/2 is the mixed number 4 and 1/2, so x^4 comes out and x^(1/2) =
      sqrt(x) stays in. Same as x^8 times x.
    scores: {mixed: 1, parts: 1}
  - response: "They both give x^4 sqrt(x)."
    scores: {mixed: 0, parts: 0}
