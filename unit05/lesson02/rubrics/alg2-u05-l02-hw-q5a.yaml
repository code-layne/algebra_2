# Rubric for homework item 5(a), a radical does not split over addition (Unit 5, Lesson 5.2).
id: q5a
points: 3
task: >-
  A classmate claims sqrt(36 + 64) = sqrt(36) + sqrt(64). Evaluate both sides
  to show they are not equal, then write the rule that does work and check it
  on the same two numbers.
criteria:
  - id: evaluate
    points: 1
    full: >-
      Evaluates both sides correctly: sqrt(100) = 10 and 6 + 8 = 14, so they
      are not equal.
  - id: rule
    points: 1
    full: >-
      States the product property sqrt(ab) = sqrt(a) * sqrt(b) as the rule
      that works.
  - id: check
    points: 1
    full: >-
      Checks it on 36 and 64: sqrt(36*64) = sqrt(2304) = 48 and 6 * 8 = 48.
examples:
  - response: >-
      sqrt(100) = 10 but 6 + 8 = 14. The rule is sqrt(ab) = sqrt(a)sqrt(b):
      sqrt(2304) = 48 = 6*8.
    scores: {evaluate: 1, rule: 1, check: 1}
  - response: "10 is not 14 so they are not equal."
    scores: {evaluate: 1, rule: 0, check: 0}
