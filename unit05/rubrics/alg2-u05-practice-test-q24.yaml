# Rubric for practice test Part D item 2, the roller-coaster model v(h) = 8sqrt(h) (Unit 5).
# Criteria from the key's scoring note (6 pts).
id: q24
points: 6
task: >-
  A roller-coaster car dropping h feet reaches speed v(h) = 8sqrt(h) feet per
  second. (a) State the sensible domain and connect it to the even-index rule.
  (b) Find v(9) and v(36) with units; what does quadrupling the drop do to the
  speed, and why? (c) A car reaches 56 ft/s; find the height algebraically and
  check it. (d) Write the inverse h(v) and say what it tells an engineer. (e)
  Explain why squaring in (c) carries no danger of an extraneous solution.
criteria:
  - id: a
    points: 1
    full: h >= 0, tied to the even index (the radicand may not be negative).
  - id: b
    points: 1
    full: >-
      v(9) = 24 ft/s and v(36) = 48 ft/s with units, and quadrupling the drop
      doubles the speed because sqrt(4h) = 2sqrt(h) (half credit for "it
      doubles" with no reason).
  - id: c
    points: 1
    full: h = 49 feet.
  - id: check
    points: 1
    full: The check, v(49) = 8 * 7 = 56.
  - id: d
    points: 1
    full: >-
      h = v^2/64 (v >= 0), and what it tells an engineer: how tall to build
      the drop for a target speed.
  - id: e
    points: 1
    full: >-
      The sign argument: both sides are non-negative (sqrt(h) >= 0 and 56 > 0),
      so squaring hides no sign disagreement. "Because I checked it" earns
      nothing.
examples:
  - response: >-
      (a) h >= 0, even index. (b) 24 and 48 ft/s, quadrupling doubles it since
      sqrt(4h) = 2sqrt(h). (c) sqrt(h) = 7 so h = 49; 8*7 = 56. (d) h = v^2/64,
      tells how high to build for a speed. (e) both sides are positive.
    scores: {a: 1, b: 1, c: 1, check: 1, d: 1, e: 1}
  - response: "(c) h = 49. (e) because I checked it."
    scores: {a: 0, b: 0, c: 1, check: 0, d: 0, e: 0}
