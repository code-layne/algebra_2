# Rubric for practice test Part C item 5(f), why the cube root's domain differs (Unit 5).
id: q19i
points: 1
task: >-
  p(x) = cbrt(x - 1) + 2 has domain (-infinity, infinity), unlike
  g(x) = -2sqrt(x + 3) + 4. In one sentence, say why.
criteria:
  - id: index
    points: 1
    full: >-
      Names the index: 3 is odd, a cube root keeps the sign and forbids no
      input (an assertion of "all reals" without the index earns nothing).
examples:
  - response: "the index is odd so negatives are allowed under a cube root"
    scores: {index: 1}
  - response: "because it is all real numbers"
    scores: {index: 0}
