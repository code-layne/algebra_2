# Rubric for practice test Part C item 8(b), verifying an inverse by composition (Unit 5).
id: q22b
points: 2
task: >-
  f(x) = 4x - 7 and f^-1(x) = (x + 7)/4. Verify by composition, both orders,
  that f^-1 really is the inverse.
criteria:
  - id: first
    points: 1
    full: f(f^-1(x)) = 4(x + 7)/4 - 7 = x + 7 - 7 = x.
  - id: second
    points: 1
    full: >-
      f^-1(f(x)) = ((4x - 7) + 7)/4 = x. One order alone is not a
      verification.
examples:
  - response: "4((x+7)/4) - 7 = x and (4x-7+7)/4 = x so yes"
    scores: {first: 1, second: 1}
  - response: "f(f^-1(x)) = x + 7 - 7 = x"
    scores: {first: 1, second: 0}
