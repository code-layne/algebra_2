# Rubric for practice test Part C item 5(a), transformations of g (Unit 5).
id: q19a
points: 1
task: >-
  List every transformation that takes y = sqrt(x) to g(x) = -2sqrt(x + 3) + 4.
criteria:
  - id: all
    points: 1
    full: >-
      Lists all four: left 3, vertical stretch by 2, reflection over the
      x-axis, up 4.
examples:
  - response: "left 3, stretch 2, flip over x-axis, up 4"
    scores: {all: 1}
  - response: "right 3, stretch 2, up 4"
    scores: {all: 0}
