# Rubric for practice test Part C item 7(c), are f o g and g o f the same (Unit 5).
id: q21e
points: 1
task: >-
  With f(x) = sqrt(x) and g(x) = x - 6, (f o g)(x) = sqrt(x - 6) with domain
  x >= 6 and (g o f)(x) = sqrt(x) - 6 with domain x >= 0. Are these the same
  function? Answer using both the rule and the domain.
criteria:
  - id: both
    points: 1
    full: >-
      No, citing both: the rules differ (right 6 vs down 6) and the domains
      differ (x >= 6 vs x >= 0). "They look different" is not enough.
examples:
  - response: "No, sqrt(x-6) shifts right and sqrt(x)-6 shifts down, and the domains x>=6 and x>=0 are different"
    scores: {both: 1}
  - response: "No, they look different"
    scores: {both: 0}
