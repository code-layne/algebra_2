# Rubric for unit test Part C item 5(a), transformations of g (Unit 5).
id: q19a
points: 1
task: >-
  List every transformation that takes y = sqrt(x) to g(x) = -3sqrt(x - 2) + 1.
criteria:
  - id: all
    points: 1
    full: >-
      Lists all four: right 2, vertical stretch by 3, reflection over the
      x-axis, up 1.
examples:
  - response: "right 2, stretch 3, flip over x-axis, up 1"
    scores: {all: 1}
  - response: "left 2, stretch 3, up 1"
    scores: {all: 0}
