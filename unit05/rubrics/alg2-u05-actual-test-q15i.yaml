# Rubric for unit test Part C item 1(f), left end behavior (Unit 5).
id: q15i
points: 1
task: >-
  For f(x) = sqrt(x + 4) - 1, describe the end behavior as x goes to negative
  infinity.
criteria:
  - id: stops
    points: 1
    full: >-
      Says there is none: the graph stops at its endpoint x = -4. Do not accept
      "negative infinity" or a blank.
examples:
  - response: "nothing, the graph stops at x = -4"
    scores: {stops: 1}
  - response: "-infinity"
    scores: {stops: 0}
