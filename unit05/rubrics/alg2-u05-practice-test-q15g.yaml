# Rubric for practice test Part C item 1(e), the absolute extremum of f (Unit 5).
id: q15g
points: 1
task: >-
  The graph of f(x) = sqrt(x + 1) - 2 starts at the endpoint (-1, -2) and
  climbs forever. Does f have an absolute maximum or an absolute minimum? Give
  it and say where it occurs.
criteria:
  - id: min
    points: 1
    full: >-
      An absolute minimum of -2 at the endpoint x = -1 (and no maximum, since
      the arm climbs forever). Both the value and the location are needed.
examples:
  - response: "absolute minimum of -2 at x = -1"
    scores: {min: 1}
  - response: "minimum"
    scores: {min: 0}
