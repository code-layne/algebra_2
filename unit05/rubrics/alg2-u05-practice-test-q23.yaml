# Rubric for practice test Part D item 1, the full analysis of f(x) = sqrt(x - 1) + 2 (Unit 5).
# Criteria from the key's scoring note (6 pts).
id: q23
points: 6
task: >-
  Consider f(x) = sqrt(x - 1) + 2. (a) Give the anchor point, the domain and
  the range in interval notation. (b) Find the x- and y-intercepts, or explain
  why one does not exist. (c) List the transformations from y = sqrt(x). (d)
  Find f^-1(x) and state its domain, saying where the restriction comes from.
  (e) Justify with composition, both orders, that f and f^-1 are inverses.
  (f) A classmate writes y = (x - 2)^2 + 1 with no restriction and calls it
  the inverse. Explain why that is not the inverse of f.
criteria:
  - id: a
    points: 1
    full: Anchor (1, 2) with both domain [1, infinity) and range [2, infinity) in interval notation.
  - id: b
    points: 1
    full: >-
      Both intercepts do not exist, with reasons: sqrt(x - 1) = -2 is
      impossible (an even root is never negative), and 0 is not in the domain.
      "No x-intercept" with no reason earns half.
  - id: c
    points: 1
    full: Right 1 and up 2 (no stretch, no reflection).
  - id: d
    points: 1
    full: >-
      f^-1(x) = (x - 2)^2 + 1 for x >= 2, and says the restriction is the range
      of f. No credit for the restriction if it is guessed as x >= 0.
  - id: e
    points: 1
    full: >-
      Both compositions return x: f(f^-1(x)) = |x - 2| + 2 = x for x >= 2, and
      f^-1(f(x)) = (sqrt(x - 1))^2 + 1 = x. One order is not a verification.
  - id: f
    points: 1
    full: >-
      Without the restriction it is the whole parabola, which fails the
      horizontal line test (two arms; e.g. x = 0 and x = 4 both give 5), so it
      is not the inverse; only the right arm x >= 2 is.
examples:
  - response: >-
      (a) (1,2), [1,inf), [2,inf). (b) no x-int since sqrt can't be -2, no
      y-int since 0 isn't in the domain. (c) right 1 up 2. (d) (x-2)^2+1,
      x >= 2 because that's the range of f. (e) both give x. (f) the whole
      parabola fails the horizontal line test.
    scores: {a: 1, b: 1, c: 1, d: 1, e: 1, f: 1}
  - response: >-
      (a) (1,2), x>=1, y>=2. (b) none. (c) right 1 up 2. (d) (x-2)^2+1.
      (e) f(f^-1(x)) = x. (f) it is not restricted.
    scores: {a: 0, b: 0, c: 1, d: 0, e: 0, f: 0}
