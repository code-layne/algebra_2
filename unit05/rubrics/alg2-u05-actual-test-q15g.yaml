# Rubric for unit test Part C item 1(e), the absolute extremum of f (Unit 5).
id: q15g
points: 1
task: >-
  The graph of f(x) = sqrt(x + 4) - 1 starts at the endpoint (-4, -1) and
  climbs forever. Does f have an absolute maximum or an absolute minimum? Give
  it and say where it occurs.
criteria:
  - id: min
    points: 1
    full: >-
      An absolute minimum of -1 at the endpoint x = -4 (and no maximum, since
      the arm climbs forever). Both the value and the location are needed.
examples:
  - response: "absolute minimum of -1 at x = -4"
    scores: {min: 1}
  - response: "minimum"
    scores: {min: 0}
