# Rubric for homework item 2, what makes a candidate extraneous (Unit 5, Lesson 5.5).
id: q2j
points: 2
task: >-
  sqrt(4x + 13) = x + 4 has two negative candidates, -1 and -3, and both are
  genuine solutions. So what is it that actually makes a candidate
  extraneous?
criteria:
  - id: notsign
    points: 1
    full: Says it is not the candidate's own sign (being negative) that matters.
  - id: side
    points: 1
    full: >-
      Says a candidate is extraneous when it makes the non-radical side
      negative (so the original equation is false); in (b) x + 4 is positive at
      both -1 and -3.
examples:
  - response: >-
      Being negative doesn't matter. It's extraneous if it makes the other side
      negative, because a square root can't equal a negative.
    scores: {notsign: 1, side: 1}
  - response: "When it is negative."
    scores: {notsign: 0, side: 0}
