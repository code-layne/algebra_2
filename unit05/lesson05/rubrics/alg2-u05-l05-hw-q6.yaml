# Rubric for homework item 6, why only square root equations have extraneous solutions (Unit 5, Lesson 5.5).
id: q6
points: 4
task: >-
  For a square root equation the check can reject an answer, but for a cube
  root equation the raising step can never produce one to reject. Explain both
  halves of that sentence, using the words index and sign.
criteria:
  - id: evenroot
    points: 1
    full: >-
      An even index gives the principal root, which is never negative.
  - id: square
    points: 1
    full: >-
      Squaring sends a and -a to the same number, losing the sign, so the
      squared equation can be true where the original is false; that creates
      an extraneous candidate only the check catches.
  - id: oddroot
    points: 1
    full: >-
      An odd index keeps the sign of its radicand (every real number has
      exactly one real cube root).
  - id: cube
    points: 1
    full: >-
      So cubing is reversible (A^3 = B^3 forces A = B) and the cubed equation
      has exactly the same solutions, gaining no extras.
examples:
  - response: >-
      Squaring loses the sign since 3 and -3 both square to 9, so you can get
      extra answers with an even index. Cube roots have an odd index and keep
      the sign, so cubing doesn't add any.
    scores: {evenroot: 0, square: 1, oddroot: 1, cube: 1}
  - response: "Square roots can't be negative."
    scores: {evenroot: 1, square: 0, oddroot: 0, cube: 0}
