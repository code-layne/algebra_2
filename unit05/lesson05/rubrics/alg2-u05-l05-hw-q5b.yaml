# Rubric for homework item 5(b), the skipped step (Unit 5, Lesson 5.5).
id: q5b
points: 2
task: >-
  A classmate solved sqrt(x) + 2 = 5 by writing x + 4 = 25, so x = 21. Which
  step of the method did they skip, and what should line 2 have been?
criteria:
  - id: step
    points: 1
    full: >-
      Names the skipped step, isolating the radical (they squared a sum:
      (sqrt(x) + 2)^2 is x + 4sqrt(x) + 4, not x + 4).
  - id: line2
    points: 1
    full: Says line 2 should have been sqrt(x) = 3.
examples:
  - response: "They didn't isolate. Line 2 should be sqrt(x) = 3."
    scores: {step: 1, line2: 1}
  - response: "They forgot to check."
    scores: {step: 0, line2: 0}
