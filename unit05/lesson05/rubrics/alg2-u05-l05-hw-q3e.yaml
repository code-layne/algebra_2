# Rubric for homework item 3, which rational-exponent equations have two solutions (Unit 5, Lesson 5.5).
id: q3e
points: 2
task: >-
  Of x^(3/2) = 8, x^(2/3) = 25, (x-1)^(1/3) = 4 and x^(4/3) = 16, two have two
  solutions. What do those two have in common?
criteria:
  - id: even
    points: 1
    full: Says the exponent has an even numerator (x^(2/3) and x^(4/3)).
  - id: why
    points: 1
    full: >-
      Explains that these are squares and fourth powers in disguise, so they
      lose the sign of x and both the + and - values work.
examples:
  - response: "Both have even numerators so they are like squaring and you get plus or minus."
    scores: {even: 1, why: 1}
  - response: "They are both fractions."
    scores: {even: 0, why: 0}
