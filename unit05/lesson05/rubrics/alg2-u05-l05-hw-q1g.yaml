# Rubric for homework item 1, the equation that needed no algebra (Unit 5, Lesson 5.5).
id: q1g
points: 2
task: >-
  Of sqrt(x+6) = 4, sqrt(2x-3) + 1 = 6, 3sqrt(x) - 4 = 8, cbrt(x+5) = 3,
  cbrt(4x) = -2 and sqrt(x-2) + 9 = 5, which one needed no algebra at all, and
  how did you know?
criteria:
  - id: which
    points: 1
    full: Names (f), sqrt(x-2) + 9 = 5.
  - id: why
    points: 1
    full: >-
      Explains that once isolated it asks a principal square root to equal -4,
      and an even root is never negative, so there is no solution.
examples:
  - response: "(f), because sqrt(x-2) = -4 and a square root can't be negative"
    scores: {which: 1, why: 1}
  - response: "(a) because it is easy"
    scores: {which: 0, why: 0}
