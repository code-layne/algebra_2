# Rubric for homework item 4(c), why sqrt(x+2) = -1 has no solution (Unit 5, Lesson 5.5).
id: q4f
points: 1
task: >-
  Using the graph of y = sqrt(x+2) and the line y = -1, explain why
  sqrt(x+2) = -1 has no solution.
criteria:
  - id: reason
    points: 1
    full: >-
      The line y = -1 lies entirely below the curve (they never meet), because
      a principal square root is never negative.
examples:
  - response: "the line is below the graph, square roots are never negative"
    scores: {reason: 1}
  - response: "because it's negative"
    scores: {reason: 0}
