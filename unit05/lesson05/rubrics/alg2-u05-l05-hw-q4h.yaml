# Rubric for homework item 4(d), the extraneous value from squaring (Unit 5, Lesson 5.5).
id: q4h
points: 2
task: >-
  Squaring sqrt(x+2) = -1 gives x = -1. What is that number called, and what
  does the graph of y = sqrt(x+2) say about it?
criteria:
  - id: name
    points: 1
    full: Calls it an extraneous solution.
  - id: graph
    points: 1
    full: >-
      Uses the graph: (-1, 1) is on the curve but nothing is at (-1, -1);
      squaring made y = -1 the same equation as y = 1.
examples:
  - response: "Extraneous. The graph goes through (-1,1) not (-1,-1)."
    scores: {name: 1, graph: 1}
  - response: "It's a solution"
    scores: {name: 0, graph: 0}
