# Rubric for homework item 5(a), checking a classmate's answer (Unit 5, Lesson 5.5).
id: q5a
points: 2
task: >-
  A classmate solved sqrt(x) + 2 = 5 and got x = 21. Check x = 21 in the
  original equation. Does it work?
criteria:
  - id: check
    points: 1
    full: >-
      Substitutes 21; sqrt(21) + 2 is about 6.58.
  - id: verdict
    points: 1
    full: Concludes no, it does not work (6.58 is not 5).
examples:
  - response: "sqrt(21)+2 = 6.58, not 5, so no"
    scores: {check: 1, verdict: 1}
  - response: "no"
    scores: {check: 0, verdict: 1}
