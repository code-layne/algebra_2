# Rubric for homework item 2, why an even index forces a restriction (Unit 5, Lesson 5.7).
id: q2g
points: 2
task: >-
  The inverses of x^3 - 8 and cbrt(x + 1) needed no restriction, but the
  inverse of sqrt(x) + 4 did. What is it about an even index that makes the
  difference?
criteria:
  - id: never
    points: 1
    full: An even root never returns a negative number.
  - id: range
    points: 1
    full: >-
      So f's range is only half a line, and the inverse may accept only that
      half (the inverse's domain is f's range).
examples:
  - response: >-
      Square roots only give positive outputs, so the inverse can only take
      those as inputs.
    scores: {never: 1, range: 1}
  - response: "Even numbers are different."
    scores: {never: 0, range: 0}
