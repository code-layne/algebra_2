# Rubric for homework item 2(f), inverse of sqrt(x) + 4 with its restriction (Unit 5, Lesson 5.7).
id: q2f
points: 2
task: >-
  Find the inverse of f(x) = sqrt(x) + 4, and write a domain restriction if one
  is needed.
criteria:
  - id: rule
    points: 1
    full: Gives f^-1(x) = (x - 4)^2.
  - id: restriction
    points: 1
    full: >-
      Restricts it to x >= 4 (since sqrt(y) >= 0 forces x - 4 >= 0; the range
      of f is y >= 4).
examples:
  - response: "(x-4)^2, x >= 4"
    scores: {rule: 1, restriction: 1}
  - response: "(x-4)^2"
    scores: {rule: 1, restriction: 0}
