# Rubric for homework item 4(d), a horizontal line that proves k fails the test (Unit 5, Lesson 5.7).
id: q4i
points: 1
task: >-
  k(x) = x^2 - 3 (a parabola with vertex (0, -3)) does not pass the horizontal
  line test. Give a horizontal line that proves it.
criteria:
  - id: line
    points: 1
    full: >-
      Gives a line y = c with c > -3 that meets the graph twice, e.g. y = 1
      (hits at x = 2 and x = -2).
examples:
  - response: "y = 1"
    scores: {line: 1}
  - response: "y = -3"
    scores: {line: 0}
