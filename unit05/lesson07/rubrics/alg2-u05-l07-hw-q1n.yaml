# Rubric for homework item 1(e), what the impostor pair got wrong (Unit 5, Lesson 5.7).
id: q1n
points: 1
task: >-
  f(x) = 5x - 2 and g(x) = x/5 + 2 are not inverses; the true inverse of f is
  (x + 2)/5. What exactly did g get wrong: the operations, or the order?
criteria:
  - id: order
    points: 1
    full: >-
      The order: the operations (add 2, divide by 5) are right, but it must add
      2 first and then divide.
examples:
  - response: "the order, you have to add 2 before dividing"
    scores: {order: 1}
  - response: "the operations"
    scores: {order: 0}
