# Rubric for homework item 5(c), Priya's mistake (Unit 5, Lesson 5.7).
id: q5i
points: 1
task: >-
  Priya wrote: f(x) = 5x, so f^-1(x) = 1/(5x). Name her mistake in a few words.
criteria:
  - id: mistake
    points: 1
    full: >-
      She read the -1 in f^-1 as an exponent and took the reciprocal instead
      of the inverse function.
examples:
  - response: "she thought -1 meant 1 over"
    scores: {mistake: 1}
  - response: "wrong order"
    scores: {mistake: 0}
