# Rubric for homework item 5(c), Devon's mistake (Unit 5, Lesson 5.7).
id: q5j
points: 1
task: >-
  Devon wrote: f(x) = x/4 - 9, so f^-1(x) = 4x + 9. Name his mistake in a few
  words.
criteria:
  - id: mistake
    points: 1
    full: >-
      He reversed the operations but not the order: he multiplied before
      adding (should be 4(x + 9)).
examples:
  - response: "right operations, wrong order, should add 9 first"
    scores: {mistake: 1}
  - response: "he took the reciprocal"
    scores: {mistake: 0}
