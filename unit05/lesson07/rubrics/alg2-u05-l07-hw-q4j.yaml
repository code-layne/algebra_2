# Rubric for homework item 4(e), restricting k to get an inverse (Unit 5, Lesson 5.7).
id: q4j
points: 2
task: >-
  For k(x) = x^2 - 3, name a restricted domain that would give k an inverse
  function, and write that inverse.
criteria:
  - id: domain
    points: 1
    full: Names x >= 0 (or x <= 0).
  - id: inverse
    points: 1
    full: >-
      Writes the matching inverse: sqrt(x + 3) for x >= 0 (or -sqrt(x + 3) for
      x <= 0).
examples:
  - response: "x >= 0, k^-1(x) = sqrt(x+3)"
    scores: {domain: 1, inverse: 1}
  - response: "x >= 0, sqrt(x) + 3"
    scores: {domain: 1, inverse: 0}
