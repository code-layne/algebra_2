# Rubric for homework item 2, left end behavior of m(x) = -sqrt(x+4) + 3 (Unit 5, Lesson 5.4).
id: q2o
points: 1
task: >-
  For m(x) = -sqrt(x + 4) + 3, describe the end behavior as x goes to
  negative infinity.
criteria:
  - id: stops
    points: 1
    full: >-
      Says the graph does not go there: it stops at its endpoint x = -4 (the
      domain is [-4, infinity)).
examples:
  - response: "it stops at x = -4"
    scores: {stops: 1}
  - response: "goes to 3"
    scores: {stops: 0}
