# Rubric for homework item 6, reflections of square and cube root graphs (Unit 5, Lesson 5.4).
id: q6
points: 4
task: >-
  The graphs of y = -sqrt(x) and y = sqrt(-x) are different, but the graphs of
  y = -cbrt(x) and y = cbrt(-x) are the same. Explain both facts at once,
  using the words index and symmetry.
criteria:
  - id: index
    points: 1
    full: >-
      Says the index decides whether the two flips (of the outputs and of the
      inputs) agree.
  - id: square
    points: 1
    full: >-
      Square root, even index: -sqrt(x) needs x >= 0 (right of the y-axis,
      below the x-axis) while sqrt(-x) needs x <= 0 (left, above), so they
      do not share a domain or a graph.
  - id: cube
    points: 1
    full: >-
      Cube root, odd index: cbrt(-x) = -cbrt(x), so moving the minus sign from
      inside to outside changes nothing and the two flips give one curve.
  - id: symmetry
    points: 1
    full: >-
      Names the symmetry: the cube root is symmetric about the origin
      (f(-x) = -f(x)); the square root has no such symmetry.
examples:
  - response: >-
      Square root has an even index so -sqrt(x) is on the right going down and
      sqrt(-x) is on the left going up, different. Cube root has odd index and
      origin symmetry, cbrt(-x) = -cbrt(x), so they are the same graph.
    scores: {index: 1, square: 1, cube: 1, symmetry: 1}
  - response: "Cube roots can take negatives and square roots can't."
    scores: {index: 0, square: 1, cube: 0, symmetry: 0}
