# Rubric for homework item 4, why a cube root graph has no endpoint (Unit 5, Lesson 5.4).
id: q4b
points: 2
task: >-
  The cube root function y = 2 cbrt(x - 1) - 1 has an h and a k. Why does it
  have no endpoint?
criteria:
  - id: odd
    points: 1
    full: Says the index is odd (a cube root).
  - id: domain
    points: 1
    full: >-
      Says that therefore no input is forbidden (the domain is all real
      numbers), so nothing stops the graph; (h, k) is an inflection point, not
      an endpoint.
examples:
  - response: "Odd index so every x is allowed, nothing stops it."
    scores: {odd: 1, domain: 1}
  - response: "Because it's a cube root."
    scores: {odd: 1, domain: 0}
