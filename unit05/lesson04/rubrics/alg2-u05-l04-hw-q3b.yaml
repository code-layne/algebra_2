# Rubric for homework item 3, checking the equation against a point (Unit 5, Lesson 5.4).
id: q3b
points: 1
task: >-
  The square root graph through anchor (-3, 4) and (1, 2) has equation
  y = -sqrt(x + 3) + 4. Check the equation against the point (6, 1).
criteria:
  - id: check
    points: 1
    full: >-
      Substitutes x = 6 and shows the output is 1: -sqrt(9) + 4 = -3 + 4 = 1,
      so (6, 1) is on the graph.
examples:
  - response: "-sqrt(6+3)+4 = -3+4 = 1 yes"
    scores: {check: 1}
  - response: "yes it works"
    scores: {check: 0}
