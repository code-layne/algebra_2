# Rubric for homework item 4, the absolute-value rule for even roots (Unit 5, Lesson 5.1).
id: q4d
points: 3
task: >-
  sqrt(x^2) = |x|, cbrt(x^3) = x, and the fourth root of x^4 = |x| for any
  real x. Explain the pattern: which indices need absolute value bars, and why
  does the other kind not?
criteria:
  - id: which
    points: 1
    full: Says even indices need the absolute value bars and odd indices do not.
  - id: even
    points: 1
    full: >-
      Explains the even case: an even power loses the sign (never negative),
      and the principal root is non-negative, so it cannot return a negative
      x; |x| expresses that.
  - id: odd
    points: 1
    full: >-
      Explains the odd case: an odd power keeps the sign and the odd root
      returns it, e.g. cbrt((-2)^3) = cbrt(-8) = -2.
examples:
  - response: >-
      Even roots need bars because squaring makes it positive and the root is
      always positive. Odd roots keep the negative, like cbrt(-8) = -2.
    scores: {which: 1, even: 1, odd: 1}
  - response: "Even ones need bars."
    scores: {which: 1, even: 0, odd: 0}
