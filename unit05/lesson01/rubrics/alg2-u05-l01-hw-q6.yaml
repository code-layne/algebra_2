# Rubric for homework item 6, even index and even denominator are one rule (Unit 5, Lesson 5.1).
id: q6
points: 3
task: >-
  An even index restricts a radical function's domain, and so does an even
  denominator in a rational exponent. Explain why these are not two rules
  but one.
criteria:
  - id: same
    points: 1
    full: >-
      Says the denominator of the rational exponent is the index of the
      radical.
  - id: notation
    points: 1
    full: >-
      Connects the notations, e.g. a^(1/n) = nth root of a, so x^(1/2) and
      sqrt(x) are the same function.
  - id: reason
    points: 1
    full: >-
      Gives the common reason: an even power of a real number is never
      negative, so an even root of a negative number does not exist.
examples:
  - response: >-
      x^(1/2) is sqrt(x) so the denominator is the index. Same rule. You
      can't take an even root of a negative because nothing squared is
      negative.
    scores: {same: 1, notation: 1, reason: 1}
  - response: "They are the same thing written differently."
    scores: {same: 0, notation: 1, reason: 0}
