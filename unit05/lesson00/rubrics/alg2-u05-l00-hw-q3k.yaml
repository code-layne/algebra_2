# Rubric for homework item 3, symmetry of n(x) = cbrt(x) + 1 (Unit 5, Lesson 5.0).
id: q3k
points: 2
task: >-
  The parent y = cbrt(x) is symmetric about the origin. Is n(x) = cbrt(x) + 1
  symmetric about the origin? Explain why or why not.
criteria:
  - id: shift
    points: 1
    full: >-
      Says the graph was shifted up 1, so its center of symmetry moved from
      (0,0) to (0,1) (it is not symmetric about the origin).
  - id: check
    points: 1
    full: >-
      Supports it with a value check, e.g. n(-8) = -1 but -n(8) = -3, so
      n(-x) is not -n(x).
examples:
  - response: "No, it moved up 1 so the center is (0,1). n(-8)=-1 but -n(8)=-3."
    scores: {shift: 1, check: 1}
  - response: "No because it shifted up"
    scores: {shift: 1, check: 0}
