# Rubric for homework item 4, extrema of square root vs cube root graphs (Unit 5, Lesson 5.0).
id: q4
points: 3
task: >-
  A square root graph always has exactly one absolute extremum, but a cube
  root graph has none at all. Explain why, using the word endpoint.
criteria:
  - id: sqrt
    points: 1
    full: >-
      A square root graph has an endpoint and leaves it in only one direction,
      so the endpoint is the highest or lowest point of the whole graph.
  - id: maxmin
    points: 1
    full: >-
      Says which kind: an absolute maximum if the arm falls away from the
      endpoint, an absolute minimum if it climbs.
  - id: cbrt
    points: 1
    full: >-
      A cube root graph has no endpoint; it runs to negative infinity on one
      side and positive infinity on the other, so no point is highest or
      lowest.
examples:
  - response: >-
      The square root starts at an endpoint and only goes one way, so the
      endpoint is the max or min. The cube root has no endpoint and goes
      forever both ways.
    scores: {sqrt: 1, maxmin: 1, cbrt: 1}
  - response: "Cube roots go on forever."
    scores: {sqrt: 0, maxmin: 0, cbrt: 1}
