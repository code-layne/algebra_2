# Rubric for homework item 2, end behavior of m(x) = -sqrt(x) + 3 to the left (Unit 5, Lesson 5.0).
id: q2l
points: 1
task: >-
  For m(x) = -sqrt(x) + 3, describe the end behavior as x goes to negative
  infinity.
criteria:
  - id: stops
    points: 1
    full: >-
      Says the graph does not go there: it stops at its endpoint x = 0 (the
      domain is [0, infinity), so there is no left end behavior).
examples:
  - response: "it stops at x=0, not defined for negatives"
    scores: {stops: 1}
  - response: "goes to infinity"
    scores: {stops: 0}
