# Rubric for homework item 3, what restricts a composition's domain (Unit 5, Lesson 5.6).
id: q3k
points: 2
task: >-
  With f(x) = x - 6, g(x) = sqrt(x) and h(x) = x^2 + 2, the compositions
  (g o f) and (f o g) have restricted domains but (g o h) = sqrt(x^2 + 2) does
  not. What do the restricted ones have in common that (g o h), which also
  contains a square root, does not?
criteria:
  - id: negative
    points: 1
    full: >-
      In the restricted ones the square root can be handed a negative number
      (its radicand can go negative), so some inputs are turned away.
  - id: e
    points: 1
    full: >-
      In (g o h) the radicand x^2 + 2 is at least 2 for every real x, so the
      root is never in danger; a radical alone does not restrict the domain.
examples:
  - response: >-
      In (a) and (b) you can get a negative under the root. x^2+2 is always
      positive so (e) is fine.
    scores: {negative: 1, e: 1}
  - response: "They have square roots."
    scores: {negative: 0, e: 0}
