# Rubric for homework item 4(g), where the two orders of u and v agree (Unit 5, Lesson 5.6).
id: q4i
points: 2
task: >-
  u(x) = |x| - 2 (a V with corner at (0, -2)) and v(x) = x - 1. The two
  orders (u o v) and (v o u) agree at x = 3 and x = 4 but not at x = 0. Where
  on the number line do the two orders seem to agree, and what is special
  about u there?
criteria:
  - id: where
    points: 1
    full: Says they agree for x >= 1.
  - id: why
    points: 1
    full: >-
      There u is on its right-hand arm, simply "subtract 2" with no corner to
      fold the sign, so both orders reduce to x - 3.
examples:
  - response: "x >= 1, there u is just a line x - 2 so order doesn't matter"
    scores: {where: 1, why: 1}
  - response: "at positive numbers"
    scores: {where: 0, why: 0}
