# Rubric for homework item 1, why (f o g)(1) and (g o f)(1) differ (Unit 5, Lesson 5.6).
id: q1g
points: 1
task: >-
  With f(x) = x^2 - 3 and g(x) = 2x + 5, (f o g)(1) = 46 but (g o f)(1) = 1.
  They use the same functions and the same input. Whose fault is the
  difference?
criteria:
  - id: order
    points: 1
    full: >-
      The order of composition: (f o g) runs g first, (g o f) runs f first.
examples:
  - response: "the order, which function goes first"
    scores: {order: 1}
  - response: "f's fault"
    scores: {order: 0}
