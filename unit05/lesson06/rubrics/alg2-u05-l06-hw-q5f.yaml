# Rubric for homework item 5(c), Ben's mistake (Unit 5, Lesson 5.6).
id: q5f
points: 1
task: >-
  For f(x) = x^2 and g(x) = x + 3, Ben wrote (f o g)(x) = x^2 + 3. Name his
  mistake in a few words.
criteria:
  - id: mistake
    points: 1
    full: >-
      Right idea (composition) but wrong order: x^2 + 3 is (g o f)(x), not
      (f o g)(x).
examples:
  - response: "he did g of f, backwards order"
    scores: {mistake: 1}
  - response: "he multiplied"
    scores: {mistake: 0}
