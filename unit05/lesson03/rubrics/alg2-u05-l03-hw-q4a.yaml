# Rubric for homework item 4(a), squaring a sum of radicals (Unit 5, Lesson 5.3).
id: q4a
points: 3
task: >-
  A classmate claims (sqrt(3) + sqrt(5))^2 = 3 + 5 = 8. Use decimals to show
  this is wrong, then expand it correctly and name the term they threw away.
criteria:
  - id: decimals
    points: 1
    full: >-
      Shows with decimals that it is wrong: sqrt(3) + sqrt(5) is about 3.968,
      and 3.968^2 is about 15.75, not 8.
  - id: expand
    points: 1
    full: >-
      Expands correctly: (sqrt(3) + sqrt(5))^2 = 3 + 2sqrt(15) + 5 = 8 + 2sqrt(15).
  - id: term
    points: 1
    full: Names the discarded term, the middle term 2sqrt(15).
examples:
  - response: >-
      1.73 + 2.24 = 3.97 and 3.97^2 is about 15.8, not 8. It is 8 + 2sqrt(15);
      they dropped the middle term 2sqrt(15).
    scores: {decimals: 1, expand: 1, term: 1}
  - response: "It should be 8 + sqrt(15)."
    scores: {decimals: 0, expand: 0, term: 0}
