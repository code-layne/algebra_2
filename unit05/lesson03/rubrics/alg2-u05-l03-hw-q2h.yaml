# Rubric for homework item 2, the third product with no radical (Unit 5, Lesson 5.3).
id: q2h
points: 2
task: >-
  Of the six products sqrt(2)(sqrt(8) + sqrt(18)), sqrt(5)(3 - sqrt(15)),
  (1 + sqrt(3))(4 - sqrt(3)), (sqrt(6) - sqrt(2))^2, (5 + sqrt(7))(5 - sqrt(7))
  and (2sqrt(3) + sqrt(5))(2sqrt(3) - sqrt(5)), two are conjugate pairs. A third
  also came out with no radical for a completely different reason. Which one,
  and what was the reason?
criteria:
  - id: which
    points: 1
    full: Names (a), sqrt(2)(sqrt(8) + sqrt(18)) = 10.
  - id: reason
    points: 1
    full: >-
      Gives the reason: nothing cancelled; distributing gave sqrt(16) and
      sqrt(36), perfect squares, so each term came out whole on its own.
examples:
  - response: "(a), because sqrt(16) and sqrt(36) are perfect squares"
    scores: {which: 1, reason: 1}
  - response: "(a) because it is a conjugate"
    scores: {which: 1, reason: 0}
