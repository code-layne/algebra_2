# Rubric for homework item 4(b), why the conjugate rationalizes (Unit 5, Lesson 5.3).
id: q4b
points: 3
task: >-
  To rationalize 1/(2 + sqrt(3)), why does multiplying top and bottom by
  2 + sqrt(3) fail while 2 - sqrt(3) succeeds? And why is either one allowed
  in the first place?
criteria:
  - id: fail
    points: 1
    full: >-
      (2 + sqrt(3))^2 = 7 + 4sqrt(3): the middle products are both +2sqrt(3),
      they add, and the radical survives.
  - id: succeed
    points: 1
    full: >-
      (2 + sqrt(3))(2 - sqrt(3)) = 4 - 3 = 1: the middle products cancel and
      the remaining terms are squares, so no radical is left.
  - id: allowed
    points: 1
    full: >-
      Either is allowed because top and bottom are multiplied by the same
      expression, i.e. by a fraction equal to 1, which changes the form but not
      the value.
examples:
  - response: >-
      2 + sqrt(3) squared still has 4sqrt(3) in it. With 2 - sqrt(3) the middle
      terms cancel and you get 1. It's allowed because you multiply by
      (2 - sqrt(3))/(2 - sqrt(3)) which is 1.
    scores: {fail: 1, succeed: 1, allowed: 1}
  - response: "Because 2 - sqrt(3) is the conjugate."
    scores: {fail: 0, succeed: 1, allowed: 0}
