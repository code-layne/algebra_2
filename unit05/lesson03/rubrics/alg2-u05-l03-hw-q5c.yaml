# Rubric for homework item 5(c), rationalizing 1/cbrt(5) two ways (Unit 5, Lesson 5.3).
id: q5c
points: 2
task: >-
  1/cbrt(5) was rationalized two ways: with radicals (multiply top and bottom
  by cbrt(25)) and with exponents (5^(-1/3) = 5^(2/3)/5). Why must the two
  roads agree?
criteria:
  - id: same
    points: 1
    full: >-
      Says they are the same operation: cbrt(25) = 5^(2/3), so multiplying by
      it raises the denominator's exponent from 1/3 to 1/3 + 2/3 = 1
      (completing the group of three).
  - id: exponent
    points: 1
    full: >-
      Connects to exponents: 5^(-1/3) = 5^(2/3 - 1) = 5^(2/3)/5, so the
      exponent rules give the same result as the radical method.
examples:
  - response: >-
      cbrt(25) is 5^(2/3), and 1/3 + 2/3 = 1 makes a whole 5 on the bottom.
      Same as 5^(-1/3) = 5^(2/3)/5.
    scores: {same: 1, exponent: 1}
  - response: "Because math always gives the same answer."
    scores: {same: 0, exponent: 0}
