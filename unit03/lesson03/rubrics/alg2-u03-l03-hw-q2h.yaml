# Rubric for homework item 2(c), why synthetic division cannot be used (Unit 3, Lesson 3.3).
id: q2h
points: 1
task: >-
  Explain why synthetic division cannot be used to divide
  x^4 - 2x^3 - 7x^2 + 8x + 12 by x^2 - x - 6.
criteria:
  - id: divisor
    points: 1
    full: >-
      States that the divisor is quadratic (degree 2), not a linear divisor of
      the form x - r, which synthetic division requires.
examples:
  - response: "The divisor is x^2, not x - r."
    scores: {divisor: 1}
  - response: "Because the remainder is 0."
    scores: {divisor: 0}
