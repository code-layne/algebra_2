# Rubric for homework item 3(c), comparing the quotient of (x^4 - 16) / (x - 2) with the Lesson 3.2 factorization (Unit 3, Lesson 3.3).
id: q3d
points: 2
task: >-
  Dividing x^4 - 16 by x - 2 gives the quotient x^3 + 2x^2 + 4x + 8. In
  Lesson 3.2, x^4 - 16 was factored completely. Does the quotient agree with
  that factorization? Explain in one line.
criteria:
  - id: answer
    points: 1
    full: Answers yes, the quotient agrees with the earlier factorization.
  - id: reason
    points: 1
    full: >-
      Shows the connection, e.g. x^4 - 16 = (x - 2)(x + 2)(x^2 + 4) and
      (x + 2)(x^2 + 4) = x^3 + 2x^2 + 4x + 8, so the quotient is the product of
      the other factors.
examples:
  - response: "Yes, (x+2)(x^2+4) multiplies out to x^3+2x^2+4x+8."
    scores: {answer: 1, reason: 1}
  - response: "Yes"
    scores: {answer: 1, reason: 0}
