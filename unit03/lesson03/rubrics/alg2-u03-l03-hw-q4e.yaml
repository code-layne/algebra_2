# Rubric for homework item 4(b), how the remainders show no factor (Unit 3, Lesson 3.3).
id: q4e
points: 1
task: >-
  For f(x) = x^3 - 2x^2 + 3x - 4, the remainders on division by x - 1, x + 1
  and x - 2 are -2, -10 and 2. Explain how you can tell whether any of those
  binomials is a factor of f.
criteria:
  - id: remainder
    points: 1
    full: >-
      States that none of the remainders is 0, so by the Factor Theorem none of
      the binomials is a factor.
examples:
  - response: "None of the remainders are zero."
    scores: {remainder: 1}
  - response: "They don't divide evenly into the leading coefficient."
    scores: {remainder: 0}
