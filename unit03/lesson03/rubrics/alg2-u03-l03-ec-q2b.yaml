# Rubric for Lesson 3.3 extra credit item 2(b): interpret a remainder of 0 for the riding team's
# feed bin, V(x) = x^3 + 7x^2 + 14x + 8 cubic feet, height x + 2 feet, base area x^2 + 5x + 4,
# and check the volume when the bin is 5 feet tall (x = 3).
id: q2b
points: 3
task: >-
  The remainder when V(x) = x^3 + 7x^2 + 14x + 8 is divided by the height x + 2 is 0. Explain
  what that tells you about the bin. Then find the area of the base when the bin is 5 feet tall,
  and use it to check the bin's volume.
criteria:
  - id: meaning
    points: 1
    full: >-
      Says the remainder of 0 means x + 2 divides the volume evenly, so V(x) = (x + 2)(x^2 + 5x + 4)
      exactly: volume = height times base area, as it must be for a box. No credit for "there is
      no remainder" restated without what it means for the bin.
  - id: base_area
    points: 1
    full: >-
      Height 5 ft gives x = 3, so the base area is 3^2 + 5(3) + 4 = 28 square feet.
  - id: check
    points: 1
    full: >-
      Checks the volume: 5 times 28 = 140, and V(3) = 27 + 63 + 42 + 8 = 140, so the two agree.
      Accept any correct comparison of height times base area with V(3).
examples:
  - response: >-
      Zero remainder means the height times the base area is exactly the volume. x = 3, base
      area 28. 5 x 28 = 140 and V(3) = 140.
    scores: {meaning: 1, base_area: 1, check: 1}
  - response: The remainder is 0 so there is no remainder. Base area 9 + 15 + 4 = 28.
    scores: {meaning: 0, base_area: 1, check: 0}
