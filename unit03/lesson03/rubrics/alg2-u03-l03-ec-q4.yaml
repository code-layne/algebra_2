# Rubric for Lesson 3.3 extra credit item 4: Find the mistake. Student A divided
# (x^3 - 6x^2 + 32) / (x - 4) synthetically with r = -4 and got x^2 - 10x + 40 - 128/(x - 4).
id: q4
points: 3
task: >-
  Student A divided (x^3 - 6x^2 + 32) by (x - 4) with synthetic division, using -4 beside the
  coefficients 1, -6, 0, 32, and wrote the answer x^2 - 10x + 40 - 128/(x - 4). Explain her
  mistake, then give the correct quotient and remainder.
criteria:
  - id: error
    points: 1
    full: >-
      Names the error: she used r = -4, but for the divisor x - 4 synthetic division uses r = 4
      (the number that makes x - 4 zero; the sign of the constant flips). Do not credit a claim
      that the zero placeholder is wrong - her 0 for the x-term is correct.
  - id: quotient
    points: 1
    full: >-
      Correct quotient x^2 - 2x - 8, from the bottom row 1, -2, -8 with r = 4.
  - id: remainder
    points: 1
    full: >-
      Correct remainder 0 (it divides evenly), or a check showing (x - 4)(x^2 - 2x - 8) =
      x^3 - 6x^2 + 32.
examples:
  - response: >-
      She should use 4 not -4. 4 | 1 -6 0 32 gives 1 -2 -8 0 so x^2 - 2x - 8, remainder 0.
    scores: {error: 1, quotient: 1, remainder: 1}
  - response: She forgot the zero. The answer is x^2 - 2x - 8.
    scores: {error: 0, quotient: 1, remainder: 0}
