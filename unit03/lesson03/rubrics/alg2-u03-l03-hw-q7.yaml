# Rubric for homework item 7, what a remainder of 0 on division by (x - 5) tells you (Unit 3, Lesson 3.3).
id: q7
points: 4
task: >-
  A classmate divides f(x) by (x - 5) and gets a remainder of 0. In two or
  three sentences, tell them three things they now know about f, and say which
  statement in the division statement P = D*Q + R makes it true.
criteria:
  - id: factor
    points: 1
    full: States that (x - 5) is a factor of f.
  - id: zero
    points: 1
    full: States that f(5) = 0 (5 is a zero of f).
  - id: intercept
    points: 1
    full: States that (5, 0) is an x-intercept of the graph of f.
  - id: division
    points: 1
    full: >-
      Uses P = D*Q + R: with R = 0 it becomes f(x) = (x - 5)Q(x), a product, so
      substituting x = 5 gives f(5) = 0.
examples:
  - response: >-
      x - 5 is a factor, f(5) = 0, and the graph crosses at (5,0). Since R = 0,
      f(x) = (x-5)Q(x), so plugging in 5 gives 0.
    scores: {factor: 1, zero: 1, intercept: 1, division: 1}
  - response: "x - 5 is a factor because the remainder is 0."
    scores: {factor: 1, zero: 0, intercept: 0, division: 0}
