# Rubric for homework item 6, why subtraction changes the sign of every term (Unit 3, Lesson 3.1).
id: q6
points: 3
task: >-
  Explain why subtracting a polynomial requires changing the sign of every
  term inside the parentheses, and not just the first one. Support the answer
  with a short example that goes wrong if only the first sign is changed.
criteria:
  - id: reason
    points: 1
    full: >-
      Explains that the minus sign acts as a factor of -1 that is distributed
      to each term inside the parentheses, not only the first.
  - id: example
    points: 1
    full: >-
      Gives a subtraction example worked correctly, with every sign inside the
      parentheses changed, e.g. (x^2) - (x^2 - 5) = x^2 - x^2 + 5 = 5.
  - id: wrong
    points: 1
    full: >-
      Shows that changing only the first sign in the same example gives a
      different (wrong) result, e.g. x^2 - x^2 - 5 = -5.
examples:
  - response: >-
      The minus distributes to every term like multiplying by -1.
      (x^2) - (x^2 - 5) = 5, but if you only change the first sign you get -5.
    scores: {reason: 1, example: 1, wrong: 1}
  - response: "You have to change all the signs because that is the rule."
    scores: {reason: 0, example: 0, wrong: 0}
