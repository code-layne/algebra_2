# Rubric for Lesson 3.1 extra credit item 4(c): interpret the box volume and its limits.
id: q4c
points: 2
task: >-
  An open-top box is folded from a 20-inch by 30-inch sheet of cardboard by cutting
  an x-inch square from each corner; its volume is V(x) = x(30 - 2x)(20 - 2x) cubic
  inches, and V(5) = 1000. Say what the answer V(5) = 1000 means for the box, with
  units. Then explain why x = 12 cannot work for this box.
criteria:
  - id: meaning
    points: 1
    full: >-
      States that cutting 5-inch squares gives a box that holds 1000 cubic inches
      (the volume, with cubic-inch units, for x = 5).
  - id: domain
    points: 1
    full: >-
      Explains that x = 12 makes a dimension negative or impossible, e.g. the width
      20 - 2(12) = -4 inches, or 24 inches cannot be cut from a 20-inch side.
examples:
  - response: "With 5 inch corners the box holds 1000 cubic inches. x = 12 makes the width 20 - 24 = -4, which is impossible."
    scores: {meaning: 1, domain: 1}
  - response: "The box is 1000. x = 12 is too big."
    scores: {meaning: 0, domain: 0}
