# Rubric for Lesson 3.1 extra credit item 5: Find the mistake in (x - 5)^2 (x + 1).
id: q5
points: 3
task: >-
  Student A multiplied (x - 5)^2 (x + 1) and wrote
  (x - 5)^2 (x + 1) = (x^2 + 25)(x + 1) = x^3 + x^2 + 25x + 25.
  Which step is wrong? Explain the error, and give the correct product in standard form.
criteria:
  - id: step
    points: 1
    full: >-
      Identifies the first step, (x - 5)^2 = x^2 + 25, as the wrong one.
  - id: why
    points: 1
    full: >-
      Explains that the square means (x - 5)(x - 5) = x^2 - 10x + 25: the exponent
      does not distribute over a difference, so the middle term -10x (and the sign)
      was lost.
  - id: product
    points: 1
    full: Gives the correct product x^3 - 9x^2 + 15x + 25.
examples:
  - response: "(x-5)^2 is not x^2+25, it is (x-5)(x-5) = x^2-10x+25. So the answer is x^3-9x^2+15x+25."
    scores: {step: 1, why: 1, product: 1}
  - response: "They squared wrong. It should be x^2 - 25, so x^3 + x^2 - 25x - 25."
    scores: {step: 1, why: 0, product: 0}
