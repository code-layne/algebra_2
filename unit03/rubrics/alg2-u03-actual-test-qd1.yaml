# Rubric for unit test Part D item 1, the graph plan for f(x) = 3(x+3)(x-1)^2(x-2) (Unit 3).
# Scoring from the key's teachernote (6 pts).
id: qd1
points: 6
task: >-
  For f(x) = 3(x + 3)(x - 1)^2(x - 2), without expanding: (a) state the degree
  and leading coefficient, explain how each comes from the factored form, and
  give the end behavior; (b) list the zeros with multiplicities and whether the
  graph crosses or touches at each; (c) find the y-intercept; (d) build a sign
  chart and state every interval where f(x) > 0; (e) give the greatest possible
  number of turning points, and why.
criteria:
  - id: degree_lead
    points: 1
    full: >-
      Degree 4 (exponents added, 1 + 2 + 1) and leading coefficient 3, with
      both arms up. No credit for degree 3 from counting factors.
  - id: zeros
    points: 2
    full: >-
      All three zeros with multiplicities and behavior: x = -3 (mult. 1,
      crosses), x = 1 (mult. 2, touches), x = 2 (mult. 1, crosses). One point
      if one zero, its multiplicity, or its behavior is wrong.
  - id: yint
    points: 1
    full: y-intercept (0, -18).
  - id: sign
    points: 1
    full: >-
      f(x) > 0 on (-infinity, -3) U (2, infinity), noting that the sign does not
      change at x = 1.
  - id: turning
    points: 1
    full: At most 3 turning points, justified by n - 1 for degree 4.
examples:
  - response: >-
      Degree 4, LC 3, both arms up. -3 crosses, 1 touches (mult 2), 2 crosses.
      y-int (0,-18). Positive for x < -3 and x > 2; no sign change at 1. At
      most 3 turns since 4 - 1 = 3.
    scores: {degree_lead: 1, zeros: 2, yint: 1, sign: 1, turning: 1}
