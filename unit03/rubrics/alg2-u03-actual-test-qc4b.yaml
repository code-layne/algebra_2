# Rubric for unit test Part C item 4(b), Remainder Theorem and factor check (Unit 3).
id: qc4b
points: 2
task: >-
  Use the Remainder Theorem to find the remainder when
  g(x) = x^3 - 2x^2 - 4x + 8 is divided by x - 2. Is x - 2 a factor of g?
  Explain in one sentence.
criteria:
  - id: remainder
    points: 1
    full: Evaluates g(2) correctly, 8 - 8 - 8 + 8 = 0, so the remainder is 0.
  - id: factor
    points: 1
    full: >-
      Concludes x - 2 is a factor because the remainder is 0 (Factor Theorem),
      consistent with the remainder found.
examples:
  - response: "g(2) = 0, so x - 2 is a factor because the remainder is zero."
    scores: {remainder: 1, factor: 1}
  - response: "g(-2) = 0, so it is a factor."
    scores: {remainder: 0, factor: 1}
