# Rubric for practice test Part C item 4(b), Remainder Theorem and factor check (Unit 3).
id: qc4b
points: 2
task: >-
  Use the Remainder Theorem to find the remainder when
  g(x) = x^3 + 2x^2 - 5x + 6 is divided by x + 3. Is x + 3 a factor of g?
  Explain in one sentence.
criteria:
  - id: remainder
    points: 1
    full: >-
      Evaluates g(-3) (not g(3)) correctly: -27 + 18 + 15 + 6 = 12, so the
      remainder is 12.
  - id: factor
    points: 1
    full: >-
      Concludes x + 3 is not a factor because the remainder is not 0 (Factor
      Theorem), consistent with the remainder found.
examples:
  - response: "g(-3) = 12. Not a factor since the remainder isn't 0."
    scores: {remainder: 1, factor: 1}
  - response: "g(3) = 48, so no."
    scores: {remainder: 0, factor: 1}
