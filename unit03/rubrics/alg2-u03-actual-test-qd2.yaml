# Rubric for unit test Part D item 2, the open-box model from a 14 in by 8 in sheet (Unit 3).
# Scoring from the key's teachernote (6 pts).
id: qd2
points: 6
task: >-
  An open-top box is made from a 14 in by 8 in sheet by cutting a square of
  side x from each corner. (a) Write V(x) in factored form and expand it.
  (b) State and justify the feasible domain. (c) Find V(1) with units.
  (d) Check that x = 7 makes V(x) = 0 and explain why 7 is a zero of the
  polynomial but not a possible cut length.
criteria:
  - id: volume
    points: 2
    full: >-
      V(x) = x(14 - 2x)(8 - 2x) and its expansion 4x^3 - 44x^2 + 112x. One
      point for only one of the two forms correct.
  - id: domain
    points: 2
    full: >-
      Feasible domain 0 < x < 4, justified by 8 - 2x > 0. A domain of
      0 < x < 7 earns 1 point.
  - id: value
    points: 1
    full: V(1) = 72 cubic inches, with cubic units.
  - id: zero
    points: 1
    full: >-
      Shows V(7) = 0, and rejects x = 7 because the base would collapse and
      8 - 2x would be negative (no box). "Because it is too big" without the
      dimension earns 0.
examples:
  - response: >-
      V = x(14-2x)(8-2x) = 4x^3-44x^2+112x. 0<x<7. V(1) = 72 in^3. V(7) = 0
      but 8 - 14 is a negative width.
    scores: {volume: 2, domain: 1, value: 1, zero: 1}
