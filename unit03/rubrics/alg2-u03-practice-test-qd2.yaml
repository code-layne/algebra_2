# Rubric for practice test Part D item 2, the open-box model from a 12 in by 6 in sheet (Unit 3).
# Scoring from the key's teachernote (6 pts).
id: qd2
points: 6
task: >-
  An open-top box is made from a 12 in by 6 in sheet by cutting a square of
  side x from each corner. (a) Write V(x) in factored form and expand it.
  (b) State and justify the feasible domain. (c) Find V(1) with units.
  (d) Check that x = 6 makes V(x) = 0 and explain why 6 is a zero of the
  polynomial but not a possible cut length.
criteria:
  - id: volume
    points: 2
    full: >-
      V(x) = x(12 - 2x)(6 - 2x) and its expansion 4x^3 - 36x^2 + 72x. One point
      for only one of the two forms correct.
  - id: domain
    points: 2
    full: >-
      Feasible domain 0 < x < 3, justified by 6 - 2x > 0. A domain of
      0 < x < 6 earns 1 point.
  - id: value
    points: 1
    full: V(1) = 40 cubic inches, with cubic units.
  - id: zero
    points: 1
    full: >-
      Shows V(6) = 0, and rejects x = 6 because the width 6 - 2x would be
      negative (no box). "Because it is too big" without the dimension earns 0.
examples:
  - response: >-
      V = x(12-2x)(6-2x) = 4x^3-36x^2+72x. 0<x<6. V(1) = 40 in^3. V(6) = 0 but
      the width 6-12 is negative.
    scores: {volume: 2, domain: 1, value: 1, zero: 1}
