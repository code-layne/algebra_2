# Rubric for practice test Part C item 7(a), how many solutions and which theorem (Unit 3).
id: qc7a
points: 2
task: >-
  Before solving x^3 - 3x^2 + 4x - 12 = 0: how many solutions must this
  equation have, counted with multiplicity, and which theorem says so?
criteria:
  - id: count
    points: 1
    full: Says exactly 3 solutions (counted with multiplicity).
  - id: theorem
    points: 1
    full: Names the Fundamental Theorem of Algebra.
examples:
  - response: "3, Fundamental Theorem of Algebra"
    scores: {count: 1, theorem: 1}
  - response: "3 because of the Rational Root Theorem"
    scores: {count: 1, theorem: 0}
