# Rubric for homework item 8(b), why a graph shows only a minimum degree (Unit 3, Lesson 3.6).
id: q8b
points: 2
task: >-
  Explain why a graph can never tell you the exact degree of a polynomial, only
  a minimum. Give both reasons met in this unit.
criteria:
  - id: imaginary
    points: 1
    full: >-
      Imaginary zeros never appear on a graph, so they add to the degree without
      adding x-intercepts.
  - id: multiplicity
    points: 1
    full: >-
      A factor of higher (even) multiplicity can raise the degree without adding
      an intercept, so the intercepts undercount the zeros.
examples:
  - response: >-
      Imaginary zeros don't show on the graph, and a repeated factor like
      (x-2)^2 only shows as one intercept.
    scores: {imaginary: 1, multiplicity: 1}
  - response: "You can't see the imaginary zeros."
    scores: {imaginary: 1, multiplicity: 0}
