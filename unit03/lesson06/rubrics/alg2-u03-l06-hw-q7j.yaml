# Rubric for homework item 7(e), interpreting V(4) (Unit 3, Lesson 3.6).
id: q7j
points: 1
task: >-
  For the open box made from a 12-inch square by cutting squares of side x
  from each corner, V(x) = 4x^3 - 48x^2 + 144x and V(4) = 64. Interpret V(4)
  in a sentence about boxes.
criteria:
  - id: context
    points: 1
    full: >-
      States that cutting 4-inch squares from the corners gives a box that holds
      64 cubic inches (both the input and the output in context, with units).
examples:
  - response: "If you cut 4 inch squares, the box holds 64 cubic inches."
    scores: {context: 1}
  - response: "V(4) = 64"
    scores: {context: 0}
