# Rubric for homework item 6(d), why the relative maximum is not absolute (Unit 3, Lesson 3.6).
id: q6j
points: 1
task: >-
  For p(x) = x^4 - 4x^2, the relative maximum at (0, 0) is not an absolute
  maximum. Explain why.
criteria:
  - id: arms
    points: 1
    full: >-
      States that both arms rise without bound, so the graph goes far above
      y = 0 and (0, 0) is not the highest point.
examples:
  - response: "Both ends go up forever so there are higher points."
    scores: {arms: 1}
  - response: "Because it is a turning point."
    scores: {arms: 0}
