# Rubric for homework item 7(b), why a cut of x = 7 is impossible (Unit 3, Lesson 3.6).
id: q7d
points: 1
task: >-
  A 12-inch by 12-inch square of sheet metal has a square of side x cut from
  each corner and is folded into an open box. Explain why x = 7 is impossible.
criteria:
  - id: negative
    points: 1
    full: >-
      Shows that the base side 12 - 2x would be 12 - 14 = -2, a negative length
      (two 7-inch cuts do not fit in 12 inches).
examples:
  - response: "12 - 2(7) = -2, you can't have a negative side."
    scores: {negative: 1}
  - response: "The volume would be too big."
    scores: {negative: 0}
