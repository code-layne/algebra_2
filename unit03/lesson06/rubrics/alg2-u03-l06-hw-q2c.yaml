# Rubric for homework item 2, the feature that tells the two graphs apart (Unit 3, Lesson 3.6).
id: q2c
points: 1
task: >-
  One graph is y = x^2(x - 3) and the other is y = x(x - 3)^2. What single
  feature tells you which graph is which?
criteria:
  - id: feature
    points: 1
    full: >-
      Names where the double zero is (where the graph touches): y = x^2(x - 3)
      touches at 0 and crosses at 3; y = x(x - 3)^2 crosses at 0 and touches
      at 3.
examples:
  - response: "Where it touches the x-axis - the squared factor touches."
    scores: {feature: 1}
  - response: "The end behavior."
    scores: {feature: 0}
