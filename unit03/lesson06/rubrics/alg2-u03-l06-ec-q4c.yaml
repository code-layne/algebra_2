# Rubric for Lesson 3.6 extra credit item 4(c): interpreting a cubic course-profile model.
id: q4c
points: 2
task: >-
  The height of a cross-country course above the starting line is
  h(x) = x(x - 2)(x - 6) meters, x hundred meters into the course (0 <= x <= 6).
  Explain what h(4) = -16 means on the course, and say for which stretch of the
  course the runners are below the starting line.
criteria:
  - id: meaning
    points: 1
    full: >-
      Interprets h(4) = -16 in context with both units: 400 meters into the
      course the runners are 16 meters below the starting line. No credit for
      "the height is -16" with no reference to below the start or no distance.
  - id: interval
    points: 1
    full: >-
      States the course is below the starting line between x = 2 and x = 6,
      i.e. from 200 m to 600 m (open or closed endpoints both accepted), from
      the cubic changing sign at the crossing zeros 2 and 6.
examples:
  - response: "At 400 m the runners are 16 m below where they started. Below the start from 200 m to 600 m."
    scores: {meaning: 1, interval: 1}
  - response: "h(4) is -16 so it is negative. Below from 2 to 6."
    scores: {meaning: 0, interval: 1}
