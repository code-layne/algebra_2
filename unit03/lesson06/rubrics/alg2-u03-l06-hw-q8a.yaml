# Rubric for homework item 8(a), sign changes only at odd-multiplicity zeros (Unit 3, Lesson 3.6).
id: q8a
points: 2
task: >-
  A classmate graphs y = (x - 5)^2(x + 2), sees the graph above the x-axis for
  x > -2 except where it touches at x = 5, and says "so the graph changes from
  positive to negative at x = 5." Fix the sentence and explain the rule they
  missed.
criteria:
  - id: fix
    points: 1
    full: >-
      Corrects the sentence: the graph stays positive on both sides of x = 5;
      it touches and turns back.
  - id: rule
    points: 1
    full: >-
      States the rule: the sign changes only at a zero of odd multiplicity, and
      x = 5 has even multiplicity (2).
examples:
  - response: >-
      It stays positive on both sides of 5 because it only touches. A graph only
      changes sign at odd multiplicity zeros and (x-5)^2 is even.
    scores: {fix: 1, rule: 1}
  - response: "It changes from negative to positive at 5."
    scores: {fix: 0, rule: 0}
