# Rubric for Lesson 3.6 extra credit item 5: Find the mistake (a touch treated as multiplicity 1).
id: q5
points: 3
task: >-
  A cubic's graph touches the x-axis at x = -2, crosses at x = 3, and passes
  through (0, -12). Student A wrote f(x) = a(x + 2)(x - 3), found a = 2, and
  gave f(x) = 2(x + 2)(x - 3). Identify the wrong step, explain why, and write
  the correct equation.
criteria:
  - id: step
    points: 1
    full: >-
      Identifies the first step (the factored form) as wrong: the zero at
      x = -2 was given multiplicity 1.
  - id: reason
    points: 1
    full: >-
      Explains that a touch means an even multiplicity, so the factor must be
      (x + 2)^2; or that a cubic needs three zeros counted with multiplicity
      and Student A's polynomial has only degree 2. Either reason earns the point.
  - id: equation
    points: 1
    full: >-
      Writes the correct equation f(x) = (x + 2)^2(x - 3), with a = 1 from
      -12 = a(4)(-3). Any equivalent form (including expanded
      x^3 + x^2 - 8x - 12) earns the point.
examples:
  - response: "The touch at -2 should be squared, (x+2)^2, because touching means even. f(x) = (x+2)^2(x-3)."
    scores: {step: 1, reason: 1, equation: 1}
  - response: "It should be (x+2)^2 so f(x) = 2(x+2)^2(x-3)."
    scores: {step: 1, reason: 0, equation: 0}
