# Rubric for Lesson 3.2 extra credit item 3: Find the mistake in a difference of cubes (3 pts).
id: q3
points: 3
task: >-
  Student A factored 8x^3 - 27 as (2x - 3)(4x^2 + 12x + 9), saying "a = 2x and b = 3,
  so the middle term is 2ab = 12x." Explain Student A's mistake and give the correct
  factorization.
criteria:
  - id: error
    points: 1
    full: >-
      Names the error: the trinomial's middle term is ab, not 2ab (Student A wrote the
      perfect-square pattern a^2 + 2ab + b^2).
  - id: middle
    points: 1
    full: >-
      Gives the correct middle term 6x = (2x)(3), with a positive sign (SOAP: opposite of
      the minus in the original).
  - id: answer
    points: 1
    full: Gives the correct factorization (2x - 3)(4x^2 + 6x + 9).
examples:
  - response: "The middle should be ab = 6x not 12x. (2x-3)(4x^2+6x+9)"
    scores: {error: 1, middle: 1, answer: 1}
  - response: "It should be (2x-3)(4x^2-6x+9) because the middle term is ab."
    scores: {error: 1, middle: 0, answer: 0}
