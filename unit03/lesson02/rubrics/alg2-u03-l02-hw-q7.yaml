# Rubric for homework item 7, sums of squares vs sums of cubes (Unit 3, Lesson 3.2).
id: q7
points: 3
task: >-
  x^2 + 9 cannot be factored, but x^3 + 27 can. Explain the difference, and
  include the factorization of x^3 + 27 as part of the answer.
criteria:
  - id: squares
    points: 1
    full: >-
      Explains why a sum of squares does not factor over the integers, e.g. it
      would need two integers with product 9 and sum 0, and there are none.
  - id: cubes
    points: 1
    full: >-
      Explains that a sum of cubes does factor, by the identity
      a^3 + b^3 = (a + b)(a^2 - ab + b^2) (the middle products cancel).
  - id: factorization
    points: 1
    full: Gives the factorization x^3 + 27 = (x + 3)(x^2 - 3x + 9).
examples:
  - response: "Sums never factor, but x^3+27 = (x+3)(x^2-3x+9)."
    scores: {squares: 0, cubes: 0, factorization: 1}
  - response: >-
      x^2+9 has no two numbers that multiply to 9 and add to 0. Cubes use
      a^3+b^3=(a+b)(a^2-ab+b^2), so x^3+27=(x+3)(x^2-3x+9).
    scores: {squares: 1, cubes: 1, factorization: 1}
