# Rubric for Lesson 3.2 extra credit item 5(c): why the hay bin needs x > 5 (2 pts).
id: q5c
points: 2
task: >-
  The hay bin has volume V(x) = (x - 2)(x - 5)(x + 5) cubic feet, each factor one
  dimension. Explain why the bin can only be built when x > 5.
criteria:
  - id: positive
    points: 1
    full: >-
      States that every dimension (length) of a real bin must be positive (greater than 0).
  - id: factor
    points: 1
    full: >-
      Identifies x - 5 as the factor that limits it: x - 5 > 0 only when x > 5 (at x = 5 a
      dimension and the volume are 0; below 5 a dimension is negative).
examples:
  - response: "Because x-5 has to be positive, it's a side length, so x has to be more than 5."
    scores: {positive: 1, factor: 1}
  - response: "If x = 5 the volume is 0."
    scores: {positive: 0, factor: 1}
