# Rubric for homework item 4(d), verifying the conjugate pair and the zero count (Unit 3, Lesson 3.5).
id: q4f
points: 2
task: >-
  The solutions of x^3 - 7x^2 + 17x - 15 = 0 are 3, 2 + i and 2 - i. Verify
  that one of the imaginary solutions is paired correctly, and explain how the
  degree confirms you are finished.
criteria:
  - id: pair
    points: 1
    full: States that 2 + i and 2 - i are complex conjugates, so the pairing is correct.
  - id: degree
    points: 1
    full: >-
      States that degree 3 means exactly 3 zeros, and 1 real + 2 imaginary = 3,
      so all zeros have been found.
examples:
  - response: "2+i and 2-i are conjugates. Degree 3 so 3 zeros: 3, 2+i, 2-i. Done."
    scores: {pair: 1, degree: 1}
  - response: "The discriminant is negative."
    scores: {pair: 0, degree: 0}
