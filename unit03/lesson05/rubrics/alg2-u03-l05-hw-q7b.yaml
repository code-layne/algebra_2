# Rubric for homework item 7(b), the fifth zero and why (Unit 3, Lesson 3.5).
id: q7b
points: 2
task: >-
  A polynomial of degree 5 with real coefficients has zeros 3, -1
  (multiplicity 2), and 2 - i. What is the fifth zero, and how do you know?
criteria:
  - id: zero
    points: 1
    full: Gives the fifth zero as 2 + i.
  - id: reason
    points: 1
    full: >-
      Explains that imaginary zeros of a polynomial with real coefficients come
      in conjugate pairs, so 2 - i requires its conjugate 2 + i.
examples:
  - response: "2+i, because complex zeros come in conjugate pairs when the coefficients are real."
    scores: {zero: 1, reason: 1}
  - response: "-2+i"
    scores: {zero: 0, reason: 0}
