# Rubric for Lesson 3.5 extra credit item 4(c): the hot-chocolate cart's turning point (4, 0).
id: q4c
points: 2
task: >-
  P(w) is the spirit club's total profit (hundreds of dollars) w weeks after its hot-chocolate
  cart opened, 0 <= w <= 6, with P(0) = -4, a relative maximum at (2, 1), a turning point at
  (4, 0), and P(6) = 5. Is 0 a relative minimum, an absolute minimum, or both? Explain, and say
  what (4, 0) means for the club.
criteria:
  - id: relative
    points: 1
    full: >-
      Says 0 is a relative minimum only (lowest point near week 4), not the absolute minimum,
      because P(0) = -4 is lower (the absolute minimum is -4 at w = 0).
  - id: meaning
    points: 1
    full: >-
      Interprets (4, 0) in context: at week 4 the club's total profit was exactly $0 (it broke
      even) and after that the total profit increased.
examples:
  - response: "It's relative because the start (0,-4) is lower. At week 4 they had made back exactly what they spent, then profit went up."
    scores: {relative: 1, meaning: 1}
  - response: "Absolute minimum, the lowest point on the graph is 0."
    scores: {relative: 0, meaning: 0}
