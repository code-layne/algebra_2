# Rubric for Lesson 3.5 extra credit item 5: Find the mistake on Q(x) = (1/4)(x+1)^2(x-3)^2.
id: q5
points: 3
task: >-
  Student A read the graph of Q(x) = (1/4)(x + 1)^2(x - 3)^2 (turning points (-1, 0), (1, 4),
  (3, 0)) and wrote "The absolute maximum of Q is 4, and Q is increasing on (0, 4)." Find both
  mistakes, explain each, and write the correct interval(s) where Q is increasing.
criteria:
  - id: absolute
    points: 1
    full: >-
      Explains that 4 is only a relative maximum: Q has even degree with a positive leading
      coefficient, so both arms rise above 4 and Q has no absolute maximum.
  - id: xvalues
    points: 1
    full: >-
      Explains that (0, 4) uses the y-values of the turning points; increasing/decreasing
      intervals are written with x-values.
  - id: fix
    points: 1
    full: Gives the correct increasing intervals, (-1, 1) U (3, infinity).
examples:
  - response: "4 is not the absolute max because the graph keeps going up on both sides. They used y values; it should be (-1,1) and (3,inf)."
    scores: {absolute: 1, xvalues: 1, fix: 1}
  - response: "Increasing on (-1,1)."
    scores: {absolute: 0, xvalues: 0, fix: 0}
