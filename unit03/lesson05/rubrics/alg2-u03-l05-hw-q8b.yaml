# Rubric for homework item 8(b), correcting "the other two are missing" (Unit 3, Lesson 3.5).
id: q8b
points: 2
task: >-
  A classmate solves a cubic, finds one real solution, and says "the other two
  are missing." Rewrite their sentence so it is correct, and say what a graph
  can and cannot show.
criteria:
  - id: rewrite
    points: 1
    full: >-
      Rewrites the sentence correctly, e.g. "the other two are imaginary";
      nothing is missing, since a cubic has exactly three complex zeros.
  - id: graph
    points: 1
    full: >-
      States that a graph shows each real zero as an x-intercept but cannot
      show imaginary zeros.
examples:
  - response: >-
      The other two solutions are imaginary. The graph only shows real zeros as
      x-intercepts, not imaginary ones.
    scores: {rewrite: 1, graph: 1}
  - response: "The other two are hidden on the graph."
    scores: {rewrite: 0, graph: 0}
