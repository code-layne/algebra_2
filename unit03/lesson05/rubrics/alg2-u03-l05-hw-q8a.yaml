# Rubric for homework item 8(a), why an odd-degree real polynomial has a real zero (Unit 3, Lesson 3.5).
id: q8a
points: 2
task: >-
  Explain why every polynomial of odd degree with real coefficients must have
  at least one real zero. Give both reasons, the conjugate-pair one and the
  end-behavior one.
criteria:
  - id: conjugate
    points: 1
    full: >-
      Conjugate-pair reason: imaginary zeros come in pairs, so their number is
      even; an odd degree minus an even number is odd, so at least one zero is
      real.
  - id: endbehavior
    points: 1
    full: >-
      End-behavior reason: the arms of an odd-degree graph point in opposite
      directions, so the graph must cross the x-axis at least once.
examples:
  - response: >-
      Imaginary zeros come in pairs so there is one left over that is real. Also
      one end goes up and the other goes down, so it has to cross the x-axis.
    scores: {conjugate: 1, endbehavior: 1}
  - response: "One arm goes up and one goes down so it crosses."
    scores: {conjugate: 0, endbehavior: 1}
