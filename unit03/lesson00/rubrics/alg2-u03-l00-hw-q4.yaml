# Rubric for homework item 4, why an odd-degree polynomial has no absolute extrema (Unit 3, Lesson 3.0).
id: q4
points: 2
task: >-
  Explain why an odd-degree polynomial has no absolute maximum and no absolute
  minimum. Refer to what its two arms do.
criteria:
  - id: arms
    points: 1
    full: >-
      States that the two arms of an odd-degree polynomial go in opposite
      directions: one toward +infinity and the other toward -infinity.
  - id: conclusion
    points: 1
    full: >-
      Concludes from the unbounded outputs that no output is greatest and none
      is least, so there is no absolute maximum and no absolute minimum.
examples:
  - response: >-
      One arm goes up forever and the other goes down forever, so there is
      no highest or lowest point.
    scores: {arms: 1, conclusion: 1}
  - response: "Because it has turning points."
    scores: {arms: 0, conclusion: 0}
