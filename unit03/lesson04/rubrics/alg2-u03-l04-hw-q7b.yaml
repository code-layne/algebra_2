# Rubric for homework item 7(b), an empty candidate test is not necessarily an error (Unit 3, Lesson 3.4).
id: q7b
points: 2
task: >-
  A classmate tests every candidate on a cubic and none of them gives 0. They
  conclude that they made an arithmetic mistake. Are they necessarily right?
  Answer in one or two sentences.
criteria:
  - id: answer
    points: 1
    full: Answers no, they are not necessarily right.
  - id: reason
    points: 1
    full: >-
      Explains that the list contains only possible rational zeros; a cubic can
      have no rational zeros at all (its real zeros may be irrational), so an
      empty result can be legitimate.
examples:
  - response: >-
      No. The list is only possible rational zeros, and the zeros could all be
      irrational, like x^3 - 3x - 1.
    scores: {answer: 1, reason: 1}
  - response: "Yes, every cubic has a rational zero."
    scores: {answer: 0, reason: 0}
