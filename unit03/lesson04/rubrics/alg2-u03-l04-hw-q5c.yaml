# Rubric for homework item 5(c), verifying a solution by substitution (Unit 3, Lesson 3.4).
id: q5c
points: 1
task: >-
  The solutions of x^3 + 2x^2 - 5x - 6 = 0 are x = -3, -1, 2. Substitute one
  solution to show it gives 0.
criteria:
  - id: substitution
    points: 1
    full: >-
      Substitutes one of -3, -1 or 2 into f(x) = x^3 + 2x^2 - 5x - 6 with correct
      arithmetic that gives 0, e.g. f(2) = 8 + 8 - 10 - 6 = 0.
examples:
  - response: "f(2) = 8 + 8 - 10 - 6 = 0"
    scores: {substitution: 1}
  - response: "f(-1) = -1 + 2 + 5 - 6 = 0"
    scores: {substitution: 1}
  - response: "f(1) = 1 + 2 - 5 - 6 = -8"
    scores: {substitution: 0}
