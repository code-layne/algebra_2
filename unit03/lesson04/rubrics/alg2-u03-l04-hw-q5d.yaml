# Rubric for homework item 5(c), what the graph does at each solution (Unit 3, Lesson 3.4).
id: q5d
points: 1
task: >-
  The solutions of x^3 + 2x^2 - 5x - 6 = 0 are x = -3, -1 and 2. State what the
  graph of f(x) = x^3 + 2x^2 - 5x - 6 must look like at each solution.
criteria:
  - id: crosses
    points: 1
    full: >-
      States that the graph crosses the x-axis at all three solutions, because
      each zero has multiplicity 1.
examples:
  - response: "it crosses the x-axis at -3, -1 and 2"
    scores: {crosses: 1}
  - response: "it touches at each one"
    scores: {crosses: 0}
