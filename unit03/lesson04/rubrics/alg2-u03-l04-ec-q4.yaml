# Rubric for Lesson 3.4 extra credit item 4: Find the mistake, odd degree vs. odd function.
id: q4
points: 3
task: >-
  Student A classified g(x) = x^3 + 1: "1. The degree of g is 3, which is odd. 2. So g is an
  odd function, and its graph is symmetric about the origin." Which step is wrong? Explain
  the error, show the correct test, and classify g.
criteria:
  - id: error
    points: 1
    full: >-
      Identifies step 2: an odd degree does not make a function odd; odd means
      g(-x) = -g(x) for every x (only odd powers), not an odd highest power.
  - id: test
    points: 1
    full: >-
      Computes g(-x) = -x^3 + 1 and compares it with both g(x) = x^3 + 1 and
      -g(x) = -x^3 - 1 (or shows a counterexample such as g(-1) = 0 but -g(1) = -2).
  - id: classify
    points: 1
    full: >-
      Concludes g is neither even nor odd, consistent with the test (the constant 1 is an
      even-power term mixed with the odd x^3).
examples:
  - response: "Step 2 is wrong. Odd degree isn't the test. g(-x) = -x^3 + 1, not g(x) and not -g(x) = -x^3 - 1, so neither."
    scores: {error: 1, test: 1, classify: 1}
  - response: "Step 1 is wrong, the degree is even. So g is even."
    scores: {error: 0, test: 0, classify: 0}
  - response: "Step 2. You have to check g(-x). g(-x) = -x^3 - 1 = -g(x), so it is odd."
    scores: {error: 1, test: 0, classify: 0}
