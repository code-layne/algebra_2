# Rubric for homework item 7(a), why leading coefficient 1 gives only integer candidates (Unit 3, Lesson 3.4).
id: q7a
points: 2
task: >-
  Explain in one or two sentences why the candidate list for a polynomial with
  leading coefficient 1 is made only of integers.
criteria:
  - id: denominator
    points: 1
    full: >-
      States that the denominator q of a candidate p/q must divide the leading
      coefficient, and the only divisors of 1 are +-1.
  - id: integer
    points: 1
    full: Concludes that p/q = +-p, which is an integer.
examples:
  - response: >-
      q has to be a factor of 1, so q is 1 or -1, and p/q is just +-p, an
      integer.
    scores: {denominator: 1, integer: 1}
  - response: "Because 1 is an integer."
    scores: {denominator: 0, integer: 0}
