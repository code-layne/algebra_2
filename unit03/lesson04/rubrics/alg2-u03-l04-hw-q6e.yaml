# Rubric for homework item 6(c), why the Rational Root Theorem misses +-sqrt(3) (Unit 3, Lesson 3.4).
id: q6e
points: 1
task: >-
  The solutions of x^3 - 2x^2 - 3x + 6 = 0 are 2, sqrt(3) and -sqrt(3). Two of
  them were never on the candidate list. Explain why the Rational Root Theorem
  could not have found them.
criteria:
  - id: irrational
    points: 1
    full: >-
      States that +-sqrt(3) are irrational (not a ratio of integers), and the
      theorem only lists rational candidates.
examples:
  - response: "They are irrational and the theorem only gives fractions p/q."
    scores: {irrational: 1}
  - response: "I made a mistake in the list."
    scores: {irrational: 0}
