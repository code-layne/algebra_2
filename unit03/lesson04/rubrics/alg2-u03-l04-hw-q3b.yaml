# Rubric for homework item 3(a), showing the test of a candidate zero (Unit 3, Lesson 3.4).
id: q3b
points: 1
task: >-
  For 2x^3 - 5x^2 - 4x + 3 = 0, the candidate r = 3 works. Show the test that
  proves it is a zero.
criteria:
  - id: test
    points: 1
    full: >-
      Shows a valid test that gives 0, by substitution
      (2(27) - 5(9) - 4(3) + 3 = 54 - 45 - 12 + 3 = 0) or by synthetic division
      with remainder 0.
examples:
  - response: "54 - 45 - 12 + 3 = 0"
    scores: {test: 1}
  - response: "3 is on the list"
    scores: {test: 0}
