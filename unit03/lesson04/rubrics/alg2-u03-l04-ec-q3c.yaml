# Rubric for Lesson 3.4 extra credit item 3(c): end behavior of a harvest model, interpreted.
id: q3c
points: 2
task: >-
  The garden club models the number of tomatoes harvested x weeks after planting by
  T(x) = 30x^2 - 2x^3, for 0 <= x <= 15. Write the right-end behavior of T in arrow
  notation. What would the model predict for the harvest many weeks later, and why must
  the club stop using it after week 15?
criteria:
  - id: end-behavior
    points: 1
    full: >-
      States that as x -> infinity, T(x) -> -infinity (the leading term -2x^3 is odd degree
      with a negative coefficient), in arrow notation or equivalent words.
  - id: interpretation
    points: 1
    full: >-
      Explains that the model would predict a negative number of tomatoes, which is
      impossible, so it no longer fits after week 15 (T(15) = 0, and T is negative after
      that).
examples:
  - response: "As x -> infinity, T(x) -> -infinity. It would say we harvest negative tomatoes, which can't happen; T(15) = 0 so the model ends there."
    scores: {end-behavior: 1, interpretation: 1}
  - response: "As x -> infinity, T(x) -> infinity because 30 is positive, so the harvest keeps growing."
    scores: {end-behavior: 0, interpretation: 0}
  - response: "The right end goes down, so the tomatoes keep increasing."
    scores: {end-behavior: 1, interpretation: 0}
