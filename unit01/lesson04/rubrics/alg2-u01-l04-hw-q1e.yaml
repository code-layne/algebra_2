# Rubric for homework item 1, "Which piece owns x = -1, and why?" (Unit 1, Lesson 1.4).
id: q1e
points: 2
task: >-
  For f(x) = x + 4 when x <= -1 and 2x when x > -1, say which piece owns
  x = -1, and why.
criteria:
  - id: piece
    points: 1
    full: Names the first piece (x + 4) as the one that owns x = -1.
  - id: reason
    points: 1
    full: >-
      Gives the reason from the conditions: -1 <= -1 is true, so the first
      condition includes -1, and -1 > -1 is false.
examples:
  - response: "the first one, because -1 is less than or equal to -1"
    scores: {piece: 1, reason: 1}
  - response: "2x"
    scores: {piece: 0, reason: 0}
