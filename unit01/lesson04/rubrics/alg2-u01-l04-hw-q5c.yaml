# Rubric for homework item 5(b), interpret C(8) (Unit 1, Lesson 1.4).
id: q5c
points: 2
task: >-
  A phone plan costs $30 for up to 5 GB, then $10 for each GB over 5. C(g) is
  the monthly cost for g GB. Say what C(8) = 60 means.
criteria:
  - id: value
    points: 1
    full: States the cost, $60, for 8 GB of data in a month (input and output both named with units).
  - id: context
    points: 1
    full: Explains it in context, e.g. $30 for the first 5 GB plus $10 for each of the 3 extra GB.
examples:
  - response: "Using 8 GB in a month costs $60."
    scores: {value: 1, context: 0}
  - response: "60"
    scores: {value: 0, context: 0}
