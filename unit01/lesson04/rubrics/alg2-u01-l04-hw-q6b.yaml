# Rubric for homework item 6, the reason behind the multiple-choice answer (Unit 1, Lesson 1.4).
id: q6b
points: 2
task: >-
  For f(x) = 2x + 1 when x < 2 and x - 4 when x >= 2, f(2) is asked with
  choices A 5, B -2, C 3, D undefined. Say in one sentence how you ruled out
  one of the other choices.
criteria:
  - id: piece
    points: 1
    full: >-
      Uses the boundary correctly: x = 2 satisfies x >= 2, so the second piece
      gives f(2) = 2 - 4 = -2.
  - id: rule-out
    points: 1
    full: >-
      Rules out a named wrong choice with a correct reason, e.g. A (5) comes
      from the x < 2 piece, which does not include 2; D is wrong because one
      piece does include 2.
examples:
  - response: "A is wrong because 2 is not less than 2 so you can't use 2x+1."
    scores: {piece: 0, rule-out: 1}
