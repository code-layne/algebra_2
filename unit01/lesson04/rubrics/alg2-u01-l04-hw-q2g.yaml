# Rubric for homework item 2(c), what decides whether two pieces meet (Unit 1, Lesson 1.4).
id: q2g
points: 2
task: >-
  In one sentence: what decides whether two pieces of a piecewise function
  meet at a boundary?
criteria:
  - id: same-value
    points: 1
    full: >-
      Says the pieces meet exactly when both rules give the same value (output)
      at the boundary input.
  - id: evidence
    points: 1
    full: >-
      Connects it to the pair: in (a) the rules give 3 and 4 at x = 1 (a gap,
      so it jumps); in (b) both give 3 (so it meets). Any correct reference to
      the two outputs at the boundary earns this.
examples:
  - response: "If both rules give the same y at x = 1 they meet, like k where both are 3."
    scores: {same-value: 1, evidence: 1}
  - response: "If the graph is continuous."
    scores: {same-value: 0, evidence: 0}
