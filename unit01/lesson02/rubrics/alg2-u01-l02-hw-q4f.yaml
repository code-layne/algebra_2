# Rubric for homework item 4(c), "Be careful at the boundary." (Unit 1, Lesson 1.2).
id: q4f
points: 1
task: >-
  The inequality |x - 3| < k has no solution when k <= 0. Explain what happens
  at the boundary value k = 0.
criteria:
  - id: boundary
    points: 1
    full: >-
      Says that at k = 0 the inequality asks for a distance less than 0, which is
      still impossible, so k = 0 is included in the "no solution" values.
examples:
  - response: "if k=0 then |x-3|<0 which cant happen so 0 counts too"
    scores: {boundary: 1}
  - response: "k = 0 has one solution x = 3"
    scores: {boundary: 0}
