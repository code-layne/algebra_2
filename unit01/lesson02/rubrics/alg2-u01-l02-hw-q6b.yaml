# Rubric for homework item 6, the reason after the multiple choice (Unit 1, Lesson 1.2).
id: q6b
points: 2
task: >-
  Which is the solution set of |x + 2| > 3? The choices were A -5 < x < 1,
  B x < -5 or x > 1 (correct), C x > 1, D all real numbers. Say in one
  sentence how you ruled out one of the others.
criteria:
  - id: names
    points: 1
    full: Names one of the wrong choices A, C or D.
  - id: why
    points: 1
    full: >-
      Gives a correct reason. A is the solution of |x + 2| < 3 (between, not
      outside); C leaves out the left ray x < -5; D includes numbers such as
      x = 0, where |0 + 2| = 2 is not greater than 3.
examples:
  - response: "A is for less than, greater than goes outward"
    scores: {names: 1, why: 1}
  - response: "C because it is wrong"
    scores: {names: 1, why: 0}
