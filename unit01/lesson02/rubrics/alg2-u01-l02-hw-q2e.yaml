# Rubric for homework item 2(c), one piece or two, and why (Unit 1, Lesson 1.2).
id: q2e
points: 2
task: >-
  The solution of |x + 3| < 4 is -7 < x < 1 and the solution of |x + 3| > 4 is
  x < -7 or x > 1. One of these is a single connected piece and the other is
  two. Say which, and why the distance meaning of absolute value makes that
  happen.
criteria:
  - id: which
    points: 1
    full: >-
      Says the "less than" inequality (a) is one piece and the "greater than"
      inequality (b) is two pieces.
  - id: distance
    points: 1
    full: >-
      Explains with distance from -3, for example "closer than 4 to -3" is
      everything between the two endpoints, while "farther than 4 from -3" can
      happen on either side, so it splits into two rays.
examples:
  - response: "a is one piece because being within 4 of -3 is all the numbers in between. b is two because you can be more than 4 away on the left or the right"
    scores: {which: 1, distance: 1}
  - response: "b is two pieces because it has or"
    scores: {which: 1, distance: 0}
