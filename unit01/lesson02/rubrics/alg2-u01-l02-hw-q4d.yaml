# Rubric for homework item 4(b), "because ..." (Unit 1, Lesson 1.2).
id: q4d
points: 2
task: >-
  The inequality |x - 4| >= -3 has all real numbers as its solution. Say why.
criteria:
  - id: nonneg
    points: 1
    full: >-
      Says an absolute value (a distance) is never negative: it is always 0 or
      more.
  - id: compare
    points: 1
    full: >-
      Concludes that a quantity that is at least 0 is always greater than -3, so
      every x works.
examples:
  - response: "distance is always 0 or more which is bigger than -3"
    scores: {nonneg: 1, compare: 1}
  - response: "because absolute value is positive"
    scores: {nonneg: 1, compare: 0}
