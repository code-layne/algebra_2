# Rubric for homework item 5(a), first blank, "Slope 150 means ..." (Unit 1, Lesson 1.0).
id: q5a
points: 2
task: >-
  A pool already holds 600 gallons when a hose is turned on; the hose adds 150
  gallons a minute, so W(t) = 600 + 150t after t minutes. Say what the slope
  150 means in this story.
criteria:
  - id: quantity
    points: 1
    full: Says the water in the pool goes up by 150 gallons (the amount added).
  - id: rate
    points: 1
    full: Ties the 150 gallons to each minute (a rate of 150 gallons per minute).
examples:
  - response: "150 gallons added every minute"
    scores: {quantity: 1, rate: 1}
  - response: "the pool has 150 gallons"
    scores: {quantity: 0, rate: 0}
