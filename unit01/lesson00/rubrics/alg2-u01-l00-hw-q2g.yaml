# Rubric for homework item 2(d), "Why can a line's sign change at its zero and nowhere else?" (Unit 1, Lesson 1.0).
id: q2g
points: 2
task: >-
  Two lines, f increasing and g decreasing, both have their zero at x = 1.
  Explain why a line's sign can change at its zero and nowhere else.
criteria:
  - id: crossing
    points: 1
    full: >-
      Says the sign changes only where the graph crosses the x-axis (where the
      output is 0), and that crossing point is the zero.
  - id: once
    points: 1
    full: >-
      Says a (non-horizontal) line crosses the x-axis exactly once, so there is
      only one place its sign can change.
examples:
  - response: "the line only crosses the x axis once and thats the zero, above it is positive and below is negative"
    scores: {crossing: 1, once: 1}
  - response: "because the slope stays the same"
    scores: {crossing: 0, once: 0}
