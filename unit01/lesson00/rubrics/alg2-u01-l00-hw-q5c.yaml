# Rubric for homework item 5(b), "Does that zero mean anything in this story? Explain." (Unit 1, Lesson 1.0).
id: q5c
points: 2
task: >-
  For W(t) = 600 + 150t, the gallons in a pool t minutes after a hose is turned
  on, the zero is t = -4. Does that zero mean anything in this story? Explain.
criteria:
  - id: answer
    points: 1
    full: Says no, the zero has no meaning in the story.
  - id: reason
    points: 1
    full: >-
      Explains that t = -4 is four minutes before the hose was turned on (a
      negative time the story does not cover), or that the pool never has 0
      gallons during the filling.
examples:
  - response: "No, -4 minutes is before the hose was turned on so it doesnt make sense"
    scores: {answer: 1, reason: 1}
  - response: "Yes, it is when the pool is empty"
    scores: {answer: 0, reason: 0}
