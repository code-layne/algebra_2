# Rubric for homework item 6, the reason after the multiple choice (Unit 1, Lesson 1.0).
id: q6b
points: 2
task: >-
  For y = -3x + 6, the true statement is "the zero is at x = 2" (C). The other
  choices were A "the function is increasing", B "it is positive for all
  x > 2", D "the y-intercept is (0,-3)". Name one of the other three and say
  why it is false.
criteria:
  - id: names
    points: 1
    full: Names one of A, B or D (by letter or by its statement).
  - id: why
    points: 1
    full: >-
      Gives a correct reason for that choice. A is false because the slope -3 is
      negative, so the function decreases; B is false because it is negative for
      x > 2 (positive for x < 2); D is false because the y-intercept is (0, 6),
      and -3 is the slope.
examples:
  - response: "A is wrong because the slope is negative so its decreasing"
    scores: {names: 1, why: 1}
  - response: "D is false"
    scores: {names: 1, why: 0}
