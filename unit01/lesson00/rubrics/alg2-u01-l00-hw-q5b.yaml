# Rubric for homework item 5(a), second blank, "(0,600) means ..." (Unit 1, Lesson 1.0).
id: q5b
points: 2
task: >-
  A pool already holds 600 gallons when a hose is turned on; the hose adds 150
  gallons a minute, so W(t) = 600 + 150t after t minutes. Say what the point
  (0, 600) means in this story.
criteria:
  - id: amount
    points: 1
    full: Says the pool holds 600 gallons.
  - id: time
    points: 1
    full: Says this is at time 0, when the hose is turned on (the start).
examples:
  - response: "600 gallons at the start before any water is added"
    scores: {amount: 1, time: 1}
  - response: "600 gallons"
    scores: {amount: 1, time: 0}
