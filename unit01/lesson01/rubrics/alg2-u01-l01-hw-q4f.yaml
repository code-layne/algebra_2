# Rubric for homework item 4(c), "Which of those two cannot be written as y = mx + b, and why?" (Unit 1, Lesson 1.1).
id: q4f
points: 2
task: >-
  Of the lines y = 4 and x = 4, which one cannot be written in the form
  y = mx + b, and why?
criteria:
  - id: names
    points: 1
    full: Names x = 4 (the vertical line).
  - id: reason
    points: 1
    full: >-
      Explains why, for example its slope is undefined so there is no number m
      to use, or it is not a function of x (one x has many y values), so no
      y = mx + b can describe it.
examples:
  - response: "x = 4 because the slope is undefined so you cant plug in m"
    scores: {names: 1, reason: 1}
  - response: "y = 4 because there is no x"
    scores: {names: 0, reason: 0}
