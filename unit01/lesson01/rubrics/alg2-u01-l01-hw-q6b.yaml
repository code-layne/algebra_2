# Rubric for homework item 6, the reason after the multiple choice (Unit 1, Lesson 1.1).
id: q6b
points: 2
task: >-
  Which line is perpendicular to y = (1/2)x - 4 and passes through (2, -1)?
  The choices were A y = (1/2)x - 2, B y = -2x + 3 (correct), C y = 2x - 5,
  D y = -(1/2)x. Say in one sentence how you ruled out one of the others.
criteria:
  - id: names
    points: 1
    full: Names one of the wrong choices A, C or D.
  - id: why
    points: 1
    full: >-
      Gives a correct reason. A has the same slope, so it is parallel; C has slope
      2, not the opposite reciprocal -2; D has slope -1/2, also not the opposite
      reciprocal (and does not pass through (2, -1)).
examples:
  - response: "A has the same slope 1/2 so its parallel not perpendicular"
    scores: {names: 1, why: 1}
  - response: "C is wrong"
    scores: {names: 1, why: 0}
