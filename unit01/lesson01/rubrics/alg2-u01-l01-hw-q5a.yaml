# Rubric for homework item 5(b), "The y-intercept means ..." (Unit 1, Lesson 1.1).
id: q5a
points: 2
task: >-
  A candle burns at a steady rate; its height is h(t) = -2t + 19 centimeters
  after t hours. Say what the y-intercept means in this story.
criteria:
  - id: value
    points: 1
    full: Gives the height 19 cm.
  - id: context
    points: 1
    full: Says it is the height at the start, time 0, before any burning (the candle's starting height).
examples:
  - response: "the candle was 19 cm tall when it was lit"
    scores: {value: 1, context: 1}
  - response: "19"
    scores: {value: 1, context: 0}
