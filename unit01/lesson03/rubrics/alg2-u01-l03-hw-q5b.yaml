# Rubric for homework item 5(a), "In the story it means ..." (Unit 1, Lesson 1.3).
id: q5b
points: 2
task: >-
  A drone flies in a straight line past a tower. Its distance from the tower, in
  metres, after t seconds is D(t) = 15|t - 6|. The vertex is (6, 0). Say what
  the vertex means in the story.
criteria:
  - id: time
    points: 1
    full: Says it happens at t = 6 seconds.
  - id: distance
    points: 1
    full: >-
      Says the distance is 0 there: the drone is passing the tower (its closest
      point).
examples:
  - response: "after 6 seconds the drone is at the tower"
    scores: {time: 1, distance: 1}
  - response: "the drone is 6 meters away"
    scores: {time: 0, distance: 0}
