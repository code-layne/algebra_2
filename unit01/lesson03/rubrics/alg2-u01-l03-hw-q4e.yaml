# Rubric for homework item 4(b), "What happens to the graph when a = 0?" (Unit 1, Lesson 1.3).
id: q4e
points: 2
task: >-
  For y = a|x|, what happens to the graph when a = 0?
criteria:
  - id: line
    points: 1
    full: Says the graph becomes the horizontal line y = 0 (the x-axis).
  - id: novee
    points: 1
    full: Says there is no V any more (it flattens completely; no opening up or down).
examples:
  - response: "it flattens into the line y=0, no V"
    scores: {line: 1, novee: 1}
  - response: "it gets wider"
    scores: {line: 0, novee: 0}
