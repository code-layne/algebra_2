# Rubric for homework item 6, the reason after the multiple choice (Unit 1, Lesson 1.3).
id: q6b
points: 2
task: >-
  Which describes how the graph of y = |x + 4| - 2 is obtained from the graph of
  y = |x|? The choices were A shift right 4 and down 2, B shift left 4 and
  down 2 (correct), C shift left 4 and up 2, D shift right 4 and up 2. Say in
  one sentence how you ruled out one of the others.
criteria:
  - id: names
    points: 1
    full: Names one of the wrong choices A, C or D.
  - id: why
    points: 1
    full: >-
      Gives a correct reason. A and D shift right, but the inside is 0 at
      x = -4, so the shift is left; C and D shift up, but the -2 outside the bars
      moves the graph down.
examples:
  - response: "A is wrong because x+4 means left not right"
    scores: {names: 1, why: 1}
  - response: "C, the numbers are wrong"
    scores: {names: 1, why: 0}
