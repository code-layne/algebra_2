# Rubric for homework item 2(c), shared vertex: minimum for one, maximum for the other (Unit 1, Lesson 1.3).
id: q2i
points: 2
task: >-
  The graphs of y = 3|x - 1| - 2 and y = -3|x - 1| - 2 share the vertex (1, -2).
  Explain why that same point is a minimum for one and a maximum for the other.
criteria:
  - id: up
    points: 1
    full: >-
      For y = 3|x - 1| - 2: a = 3 is positive, the V opens up (both rays rise
      away from the vertex), so every other output is above -2 and -2 is the
      minimum.
  - id: down
    points: 1
    full: >-
      For y = -3|x - 1| - 2: a = -3 is negative, the V opens down (both rays fall
      away from the vertex), so every other output is below -2 and -2 is the
      maximum.
examples:
  - response: "the first one opens up because 3 is positive so the vertex is the lowest point, the second opens down because of the negative so the vertex is the highest"
    scores: {up: 1, down: 1}
  - response: "because one is negative"
    scores: {up: 0, down: 0}
