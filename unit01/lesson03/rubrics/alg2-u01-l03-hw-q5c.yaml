# Rubric for homework item 5(c), flying twice as fast (Unit 1, Lesson 1.3).
id: q5c
points: 2
task: >-
  A drone's distance from a tower, in metres, after t seconds is
  D(t) = 15|t - 6|. If the drone flew twice as fast, which number in the rule
  changes, and how does the V change?
criteria:
  - id: number
    points: 1
    full: Says the 15 (the a value) changes, doubling to 30.
  - id: shape
    points: 1
    full: >-
      Says the V gets narrower (steeper rays), and the vertex (6, 0) stays where
      it is.
examples:
  - response: "15 becomes 30 and the V gets skinnier"
    scores: {number: 1, shape: 1}
  - response: "the 6 changes to 3"
    scores: {number: 0, shape: 0}
