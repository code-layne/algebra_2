# Rubric for homework item 3(c), "Why should the biologist not trust it?" (Unit 1, Lesson 1.5).
id: q3h
points: 2
task: >-
  A seedling's height was measured from day 0 to day 30, and the line
  y-hat = 0.8x + 5 fits the data. It predicts 85 cm on day 100. Why should the
  biologist not trust that prediction?
criteria:
  - id: outside
    points: 1
    full: >-
      Says day 100 is far outside the range of the data (0 to 30 days): it is an
      extrapolation.
  - id: pattern
    points: 1
    full: >-
      Says the linear pattern need not continue that long (for example growth
      slows or stops), so the line may no longer describe the plant.
examples:
  - response: "100 is way past the 30 days they measured and the plant probably stops growing as fast"
    scores: {outside: 1, pattern: 1}
  - response: "because 85 is too big"
    scores: {outside: 0, pattern: 0}
