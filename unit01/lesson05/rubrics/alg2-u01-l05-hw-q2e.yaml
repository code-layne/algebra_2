# Rubric for homework item 2(c), "r = -0.85 is the weaker one, because it is negative" (Unit 1, Lesson 1.5).
id: q2e
points: 2
task: >-
  Two studies report r = -0.85 and r = 0.45. A classmate says "r = -0.85 is the
  weaker one, because it is negative." What is wrong with that?
criteria:
  - id: sign
    points: 1
    full: >-
      Says the sign of r only gives the direction (negative means the trend runs
      downward), not the strength.
  - id: size
    points: 1
    full: >-
      Says strength comes from the size |r|, and 0.85 > 0.45, so r = -0.85 is the
      stronger relationship.
examples:
  - response: "negative just means it goes down. 0.85 is bigger than 0.45 so its actually stronger"
    scores: {sign: 1, size: 1}
  - response: "negative numbers are not weaker"
    scores: {sign: 0, size: 0}
