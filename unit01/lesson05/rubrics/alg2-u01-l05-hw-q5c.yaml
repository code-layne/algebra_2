# Rubric for homework item 5(b), the correlation among 9-year-olds only (Unit 1, Lesson 1.5).
id: q5c
points: 2
task: >-
  Across an elementary school, shoe size and reading level have a strong
  positive correlation, because age (the lurking variable) pushes both up. If
  the study looked only at 9-year-olds, would you expect the correlation to stay
  strong? Explain.
criteria:
  - id: answer
    points: 1
    full: Says no, the correlation would be weak.
  - id: reason
    points: 1
    full: >-
      Explains that with age held fixed the lurking variable can no longer push
      both up together, so among children of one age shoe size tells little
      about reading level.
examples:
  - response: "No, they are all the same age so age cant make both go up anymore"
    scores: {answer: 1, reason: 1}
  - response: "yes because bigger kids read better"
    scores: {answer: 0, reason: 0}
