# Rubric for homework item 4(c), "A study reports r = 1.3. What must be true?" (Unit 1, Lesson 1.5).
id: q4d
points: 2
task: >-
  A study reports a correlation coefficient r = 1.3. What must be true?
criteria:
  - id: error
    points: 1
    full: Says the value is impossible, so the study made a mistake.
  - id: bounds
    points: 1
    full: Says r is always between -1 and 1.
examples:
  - response: "its a mistake, r has to be between -1 and 1"
    scores: {error: 1, bounds: 1}
  - response: "the correlation is super strong"
    scores: {error: 0, bounds: 0}
