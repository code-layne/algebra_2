# Rubric for homework item 6, the reason after the multiple choice (Unit 1, Lesson 1.5).
id: q6b
points: 2
task: >-
  Which correlation coefficient indicates the strongest linear relationship? The
  choices were A r = 0.35, B r = -0.82 (correct), C r = 0.60, D r = -0.10. Say
  in one sentence how you ruled out one of the others.
criteria:
  - id: names
    points: 1
    full: Names one of the wrong choices A, C or D.
  - id: why
    points: 1
    full: >-
      Gives a correct reason based on size: its |r| is smaller than 0.82 (the
      minus sign of B is direction, not weakness).
examples:
  - response: "C is only 0.60 and |-0.82| is bigger"
    scores: {names: 1, why: 1}
  - response: "D is negative so it is weak"
    scores: {names: 1, why: 0}
