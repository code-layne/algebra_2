# Rubric for homework item 4(a), "r = 1 exactly: the points ..." (Unit 1, Lesson 1.5).
id: q4a
points: 2
task: >-
  If the correlation coefficient is exactly r = 1, what does the scatterplot
  look like?
criteria:
  - id: line
    points: 1
    full: Says the points lie exactly on one straight line (no scatter).
  - id: rising
    points: 1
    full: Says the line rises (positive slope).
examples:
  - response: "all lie exactly on a line going up"
    scores: {line: 1, rising: 1}
  - response: "are close together"
    scores: {line: 0, rising: 0}
