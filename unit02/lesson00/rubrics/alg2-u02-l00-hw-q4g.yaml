# Rubric for homework item 4(c), "Why can the answer never be three?" (Unit 2, Lesson 2.0).
id: q4g
points: 1
task: >-
  A parabola can have two, one, or no x-intercepts. Why can a parabola never
  have three x-intercepts?
criteria:
  - id: reason
    points: 1
    full: >-
      Says the parabola turns only once (one vertex, changes direction once),
      so it can cross a horizontal line - the x-axis - at most twice.
examples:
  - response: "it only turns around once so it can only cross twice"
    scores: {reason: 1}
  - response: "because it is a parabola"
    scores: {reason: 0}
