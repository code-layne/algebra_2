# Rubric for homework item 5(d), "Why does the model stop making sense after it lands?" (Unit 2, Lesson 2.0).
id: q5g
points: 1
task: >-
  A punted football's height in feet is h(t) = -16t^2 + 48t + 4. The ball
  lands near t = 3.1 s, but the function keeps going and its outputs keep
  falling. Why does the model stop making sense after the ball lands?
criteria:
  - id: reason
    points: 1
    full: >-
      Says that after landing the outputs would be negative, and a height
      cannot be below the ground (negative) - the ball stays on the ground.
examples:
  - response: "the height would be negative and the ball can't go underground"
    scores: {reason: 1}
  - response: "because the ball stops"
    scores: {reason: 0}
