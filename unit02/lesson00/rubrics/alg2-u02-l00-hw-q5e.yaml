# Rubric for homework item 5(c), "h(1.5) = 40 means ..." (Unit 2, Lesson 2.0).
id: q5e
points: 2
task: >-
  A punted football's height is h(t) = -16t^2 + 48t + 4, with t in seconds and
  h in feet; its graph turns at t = 1.5. Say what h(1.5) = 40 means in context.
criteria:
  - id: quantities
    points: 1
    full: >-
      Reads both numbers in context with units - the ball is 40 feet high at
      1.5 seconds after the punt.
  - id: maximum
    points: 1
    full: >-
      Says this is the ball's highest point (the maximum height), since the
      graph turns at t = 1.5.
examples:
  - response: "after 1.5 seconds the ball is 40 feet in the air, the highest it goes"
    scores: {quantities: 1, maximum: 1}
  - response: "the ball is 40 feet high"
    scores: {quantities: 0, maximum: 0}
