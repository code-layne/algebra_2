# Rubric for homework item 2(c), "What about each graph decides which kind of value it has?" (Unit 2, Lesson 2.0).
id: q2g
points: 2
task: >-
  p(x) = (x - 2)^2 - 1 has a minimum and q(x) = -(x + 1)^2 + 4 has a maximum.
  What about each graph decides which kind of value (maximum or minimum) it has?
criteria:
  - id: direction
    points: 1
    full: >-
      Names the direction the parabola opens as the deciding feature (opens up
      gives a minimum, opens down gives a maximum), or the sign of a.
  - id: applied
    points: 1
    full: >-
      Applies it to both graphs - p opens up, so its vertex is the lowest point
      (minimum); q opens down, so its vertex is the highest point (maximum).
examples:
  - response: "p opens up so the vertex is the lowest point, q opens down so the vertex is the highest. it depends on if a is positive or negative"
    scores: {direction: 1, applied: 1}
  - response: "the vertex"
    scores: {direction: 0, applied: 0}
