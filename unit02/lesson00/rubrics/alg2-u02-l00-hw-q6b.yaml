# Rubric for homework item 6, "Say in one sentence how you ruled out one of the others." (Unit 2, Lesson 2.0).
id: q6b
points: 2
task: >-
  A ball's height in feet after t seconds is h(t) = -16t^2 + 96t, with vertex
  (3, 144) and zeros t = 0 and t = 6. The choices for its maximum height were
  A 3 feet, B 144 feet, C 6 feet, D 96 feet. Say in one sentence how you ruled
  out one of the wrong choices.
criteria:
  - id: wrong_choice
    points: 1
    full: Names one of A, C or D as wrong.
  - id: reason
    points: 1
    full: >-
      Gives a correct reason for that choice - A (3) is the input, the time in
      seconds, not a height; C (6) is the landing time, a zero; D (96) is a
      coefficient of the rule, not an output of the vertex.
examples:
  - response: "A is wrong because 3 is the time when it is highest, not how high it is"
    scores: {wrong_choice: 1, reason: 1}
  - response: "C is wrong because it is too small"
    scores: {wrong_choice: 1, reason: 0}
