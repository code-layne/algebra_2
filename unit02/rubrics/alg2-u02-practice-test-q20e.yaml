# Rubric for practice test item 20(c), "Which solution do you reject, and why?" (Unit 2 practice test).
id: q20e
points: 2
task: >-
  An egg is launched up from a roof; its height in feet t seconds after launch
  is h(t) = -16t^2 + 48t + 64. Setting h(t) = 0 gives (t - 4)(t + 1) = 0.
  Which solution do you reject, and why?
criteria:
  - id: rejects
    points: 1
    full: Rejects t = -1.
  - id: reason
    points: 1
    full: >-
      Says why - time cannot be negative (the egg is launched at t = 0, so
      t = -1 is before the launch and has no meaning here).
examples:
  - response: "t = -1, because time can't be negative"
    scores: {rejects: 1, reason: 1}
  - response: "reject 4 because it is too big"
    scores: {rejects: 0, reason: 0}
