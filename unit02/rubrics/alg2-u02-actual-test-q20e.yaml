# Rubric for unit test item 20(c), "Which solution do you reject, and why?" (Unit 2 test).
id: q20e
points: 2
task: >-
  A water balloon is launched up from a balcony; its height in feet t seconds
  after launch is h(t) = -16t^2 + 16t + 32. Setting h(t) = 0 gives
  (t - 2)(t + 1) = 0. Which solution do you reject, and why?
criteria:
  - id: rejects
    points: 1
    full: Rejects t = -1.
  - id: reason
    points: 1
    full: >-
      Says why - time cannot be negative (the balloon is launched at t = 0, so
      t = -1 is before the launch and has no meaning here).
examples:
  - response: "t = -1 because you can't have negative seconds"
    scores: {rejects: 1, reason: 1}
  - response: "-1"
    scores: {rejects: 1, reason: 0}
