# Rubric for homework item 4, explain (Unit 7, Lesson 7.0).
id: q4
points: 2
task: >-
  Every parent logarithmic graph y = log_b x passes through (1, 0) and never
  crosses the y-axis, no matter what the base is. Explain both facts, using the
  words exponent and asymptote.
criteria:
  - id: one-zero
    points: 1
    full: >-
      log_b 1 asks "b to what exponent gives 1?" - always 0, since b^0 = 1 for
      every legal base, so (1, 0) is on every parent graph.
  - id: asymptote
    points: 1
    full: >-
      x = 0 would need an exponent that makes b^y = 0, and no exponent does (powers
      of a positive base are positive), so x = 0 is not in the domain; the y-axis
      is the vertical asymptote, approached but never reached.
examples:
  - response: >-
      b^0 = 1 so the exponent is 0 when x = 1, that's (1,0). No exponent makes b to
      that power 0, so x can't be 0 - the y-axis is an asymptote.
    scores: {one-zero: 1, asymptote: 1}
  - response: "because all logs start at 1"
    scores: {one-zero: 0, asymptote: 0}
