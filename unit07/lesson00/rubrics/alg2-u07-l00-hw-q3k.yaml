# Rubric for homework item 3, last part (Unit 7, Lesson 7.0).
id: q3k
points: 2
task: >-
  Compared with y = log_3 x, list every feature of n(x) = log_(1/3) x that is the
  same.
criteria:
  - id: domain-range-asymptote
    points: 1
    full: Lists the domain (0, infinity), the range (all reals) and the vertical asymptote x = 0.
  - id: intercepts-extrema
    points: 1
    full: >-
      Lists the x-intercept (1, 0), no y-intercept and no extrema - and does not
      list the direction (increasing/decreasing), end behavior or sign intervals,
      which differ.
examples:
  - response: "domain, range, asymptote x=0, x-int (1,0), no y-int, no max or min"
    scores: {domain-range-asymptote: 1, intercepts-extrema: 1}
  - response: "both increasing, same domain"
    scores: {domain-range-asymptote: 0, intercepts-extrema: 0}
