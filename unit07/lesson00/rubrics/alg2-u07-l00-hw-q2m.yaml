# Rubric for homework item 2, last part (Unit 7, Lesson 7.0).
id: q2m
points: 2
task: >-
  The parent y = log_2 x has x-intercept (1, 0) and asymptote x = 0. For
  m(x) = log_2 x - 3, subtracting 3 moved one of those two. Which one, and why
  not the other?
criteria:
  - id: which
    points: 1
    full: Only the x-intercept moved (from (1, 0) to (8, 0)).
  - id: why
    points: 1
    full: >-
      Subtracting 3 changes only the outputs; the asymptote is set by which inputs
      are legal - the argument is still x, so the domain and the asymptote x = 0
      are unchanged.
examples:
  - response: "The x-intercept moved to (8,0). The -3 is outside so it only moves the graph down, the domain is still x>0 so the asymptote stays x=0."
    scores: {which: 1, why: 1}
  - response: "the asymptote moved down 3"
    scores: {which: 0, why: 0}
