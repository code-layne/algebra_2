# Rubric for homework item 5(b), the input left out of the domain (Unit 4, Lesson 4.5).
id: q5b
points: 2
task: >-
  A student simplified g(x) = (x^2 - x - 6)/(x^2 - 9) to (x + 2)/(x + 3) and
  said the domain is all reals except x = -3. What did the student leave out
  of the domain, and why?
criteria:
  - id: which
    points: 1
    full: Names x = 3.
  - id: why
    points: 1
    full: >-
      Explains that the original denominator x^2 - 9 is zero at x = 3, so 3
      was never an allowed input (cancelling does not restore it).
examples:
  - response: "x=3, because x^2-9 is 0 there in the original"
    scores: {which: 1, why: 1}
  - response: "x=3"
    scores: {which: 1, why: 0}
