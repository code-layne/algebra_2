# Rubric for homework item 6(c), which asymptote of C(p) = 25p/(100-p) matters (Unit 4, Lesson 4.5).
id: q6k
points: 3
task: >-
  Removing p percent of a pollutant costs C(p) = 25p/(100 - p) thousand
  dollars, 0 <= p < 100. It has vertical asymptote p = 100 and horizontal
  asymptote y = -25. Which of those two asymptotes means something about this
  factory, and what does it say? And why is the other one meaningless here?
criteria:
  - id: which
    points: 1
    full: Names the vertical asymptote p = 100 as the meaningful one.
  - id: meaning
    points: 1
    full: >-
      As the target approaches 100% the cost grows without bound, so total
      removal cannot be bought at any price.
  - id: other
    points: 1
    full: >-
      The horizontal asymptote y = -25 describes p far past 100 (and a
      negative cost), but p only lives between 0 and 100.
examples:
  - response: >-
      p=100: the cost blows up as you get close to 100%, so you can never pay
      for all of it. y=-25 would need p way bigger than 100, which can't happen.
    scores: {which: 1, meaning: 1, other: 1}
  - response: "the horizontal one, the cost levels off at 25"
    scores: {which: 0, meaning: 0, other: 0}
