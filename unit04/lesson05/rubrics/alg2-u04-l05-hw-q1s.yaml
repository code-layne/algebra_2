# Rubric for homework item 1, why (x^2-9)/(x^2-6x+9) has no hole (Unit 4, Lesson 4.5).
id: q1s
points: 2
task: >-
  In (x^2 - 9)/(x^2 - 6x + 9) the factor x - 3 appears on top and on the
  bottom, and there is still no hole. Why not?
criteria:
  - id: copies
    points: 1
    full: >-
      Factors to (x - 3)(x + 3)/(x - 3)^2 and notes the denominator has two
      copies of x - 3 while the top has one.
  - id: wall
    points: 1
    full: >-
      Concludes one copy survives the cancelling, leaving (x + 3)/(x - 3), so
      x = 3 is a wall (vertical asymptote), not a hole.
examples:
  - response: "the bottom has (x-3) twice so one is left over and it makes an asymptote"
    scores: {copies: 1, wall: 1}
  - response: "because it does not cancel"
    scores: {copies: 0, wall: 0}
