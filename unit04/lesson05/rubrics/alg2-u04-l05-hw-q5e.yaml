# Rubric for homework item 5(d), the Lesson 4.1 rule the student broke (Unit 4, Lesson 4.5).
id: q5e
points: 2
task: >-
  A student simplified (x^2 - x - 6)/(x^2 - 9) to (x + 2)/(x + 3) and dropped
  the restriction x != 3. State the rule from Lesson 4.1 that the student
  broke, in one sentence.
criteria:
  - id: original
    points: 1
    full: >-
      Restrictions are read off the original denominator (before cancelling).
  - id: hole
    points: 1
    full: >-
      Cancelling never restores an input: the cancelled factor leaves a hole
      behind.
examples:
  - response: "you take restrictions from the original denominator, and a cancelled factor still leaves a hole"
    scores: {original: 1, hole: 1}
  - response: "you have to factor first"
    scores: {original: 0, hole: 0}
