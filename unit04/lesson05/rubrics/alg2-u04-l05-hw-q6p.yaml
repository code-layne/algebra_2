# Rubric for homework item 6(e), the cost near p = 100 and a 100% law (Unit 4, Lesson 4.5).
id: q6p
points: 2
task: >-
  For C(p) = 25p/(100 - p) thousand dollars, going from 90% to 95% costs an
  extra 250 thousand and from 95% to 99% an extra 2000 thousand. What is the
  graph doing near p = 100, and what does that mean for a law requiring 100%
  removal?
criteria:
  - id: graph
    points: 1
    full: >-
      The graph climbs steeply along the vertical asymptote p = 100: each
      additional percent costs more than the one before.
  - id: law
    points: 1
    full: >-
      A 100% requirement cannot be met by any finite budget (the cost is
      undefined / unbounded at p = 100).
examples:
  - response: "it shoots up toward the asymptote, so 100% would cost infinite money"
    scores: {graph: 1, law: 1}
  - response: "it gets more expensive"
    scores: {graph: 1, law: 0}
