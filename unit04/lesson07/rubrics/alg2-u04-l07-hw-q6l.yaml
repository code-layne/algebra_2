# Rubric for homework item 6(f), rejecting w = -60 vs an extraneous solution (Unit 4, Lesson 4.7).
id: q6l
points: 3
task: >-
  The seesaw equation d = 300/w accepts w = -60 and returns d = -5. You reject
  it. Is that the same kind of rejection as an extraneous solution from Lesson
  4.6? Explain.
criteria:
  - id: answer
    points: 1
    full: Says no, it is not the same kind of rejection.
  - id: satisfies
    points: 1
    full: >-
      w = -60 genuinely satisfies d = 300/w; it is rejected because weights and
      distances cannot be negative (the situation, not the algebra).
  - id: extraneous
    points: 1
    full: >-
      An extraneous solution never satisfied the original equation; it made a
      denominator zero.
examples:
  - response: >-
      No. -60 works in the equation, it just makes no sense since weight can't
      be negative. Extraneous answers don't work in the original equation at all.
    scores: {answer: 1, satisfies: 1, extraneous: 1}
  - response: "Yes, it is extraneous."
    scores: {answer: 0, satisfies: 0, extraneous: 0}
