# Rubric for homework item 3(c), why a taxi fare is not directly proportional to miles (Unit 4, Lesson 4.7).
id: q3g
points: 2
task: >-
  A taxi charges $3.00 to start the meter plus $2.00 per mile. The fare is not
  directly proportional to the miles driven. Why not?
criteria:
  - id: start
    points: 1
    full: >-
      The fare is 2m + 3: zero miles still costs $3, so the graph does not pass
      through the origin.
  - id: ratio
    points: 1
    full: Fare divided by miles is not constant (no single k with fare = k m).
examples:
  - response: "fare = 2m + 3, at 0 miles it is $3 not $0, so fare/miles changes"
    scores: {start: 1, ratio: 1}
  - response: "because it costs money"
    scores: {start: 0, ratio: 0}
