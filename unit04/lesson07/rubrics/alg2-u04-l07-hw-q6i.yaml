# Rubric for homework item 6(d), meaning of the seesaw's vertical asymptote (Unit 4, Lesson 4.7).
id: q6i
points: 2
task: >-
  For the seesaw d = 300/w, the vertical asymptote is at w = 0. What does it
  say?
criteria:
  - id: lighter
    points: 1
    full: >-
      The lighter the rider, the farther out they must sit, without bound.
  - id: weightless
    points: 1
    full: A weightless rider could never balance the seesaw at all.
examples:
  - response: "as the weight goes to 0 the distance gets huge, so a 0 lb rider can't balance it"
    scores: {lighter: 1, weightless: 1}
  - response: "w can't be 0"
    scores: {lighter: 0, weightless: 0}
