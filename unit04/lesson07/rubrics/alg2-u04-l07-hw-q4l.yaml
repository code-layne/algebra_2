# Rubric for homework item 4(d), why a direct variation never has an asymptote (Unit 4, Lesson 4.7).
id: q4l
points: 2
task: >-
  Graph II (y = 12/x) has asymptotes x = 0 and y = 0; Graph I (y = 1.5x) has
  none. Explain why a direct variation can never have an asymptote.
criteria:
  - id: domain
    points: 1
    full: >-
      y = kx is a line whose domain is all real numbers: there is no excluded
      input, so no vertical asymptote.
  - id: ends
    points: 1
    full: >-
      Its outputs keep growing without settling toward a value, so no
      horizontal asymptote.
examples:
  - response: "y=kx is a line, x can be anything and y keeps going, so there's nothing to approach"
    scores: {domain: 1, ends: 1}
  - response: "because it is direct"
    scores: {domain: 0, ends: 0}
