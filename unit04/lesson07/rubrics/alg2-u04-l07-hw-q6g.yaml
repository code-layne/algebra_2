# Rubric for homework item 6(c), meaning of the seesaw's horizontal asymptote (Unit 4, Lesson 4.7).
id: q6g
points: 2
task: >-
  On a seesaw, d = 300/w (distance from the pivot in feet, weight in pounds).
  As w gets very large, d approaches 0. Say what that horizontal asymptote
  means for a very heavy rider.
criteria:
  - id: close
    points: 1
    full: A very heavy rider must sit almost on top of the pivot.
  - id: never
    points: 1
    full: but never exactly at it (d never reaches 0).
examples:
  - response: "a really heavy person sits really close to the middle but never right on it"
    scores: {close: 1, never: 1}
  - response: "they sit at 0"
    scores: {close: 0, never: 0}
