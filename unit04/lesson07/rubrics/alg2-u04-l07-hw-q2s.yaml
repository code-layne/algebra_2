# Rubric for homework item 2, what a negative k does to a direct variation's graph (Unit 4, Lesson 4.7).
id: q2s
points: 2
task: >-
  y varies directly as x with k = -3.5 (y = -3.5x). Nothing breaks, but say
  what the negative k does to the graph.
criteria:
  - id: origin
    points: 1
    full: The graph is still a line through the origin.
  - id: direction
    points: 1
    full: It slopes downward, so y decreases as x increases.
examples:
  - response: "it still goes through (0,0) but it goes down instead of up"
    scores: {origin: 1, direction: 1}
  - response: "it is negative"
    scores: {origin: 0, direction: 0}
