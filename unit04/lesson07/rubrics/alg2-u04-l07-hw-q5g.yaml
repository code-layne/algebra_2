# Rubric for homework item 5(d), the sanity check for an inverse variation (Unit 4, Lesson 4.7).
id: q5g
points: 2
task: >-
  y varies inversely as x, y = 8 when x = 3; a student found y = 288 at
  x = 12. There was a one-second sanity check available before any arithmetic.
  What is it?
criteria:
  - id: direction
    points: 1
    full: In an inverse variation, when x goes up (3 to 12) y must go down.
  - id: apply
    points: 1
    full: So an answer of 288, larger than 8, is moving the wrong way.
examples:
  - response: "x got bigger so y should get smaller, but 288 is bigger than 8"
    scores: {direction: 1, apply: 1}
  - response: "check your work"
    scores: {direction: 0, apply: 0}
