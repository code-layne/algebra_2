# Rubric for homework item 3, why the graph of g is a straight line (Unit 4, Lesson 4.1).
id: q3f
points: 2
task: >-
  The graph of g(x) = (x^2 + 2x - 8)/(x - 2) is a straight line with a hole.
  Why is the graph a straight line even though g is a rational function?
criteria:
  - id: cancels
    points: 1
    full: >-
      Says the only denominator factor (x - 2) cancels with a numerator factor,
      so no variable denominator is left.
  - id: line
    points: 1
    full: >-
      Concludes that away from x = 2 the expression equals x + 4, so the graph
      is the line y = x + 4 (with a hole at x = 2).
examples:
  - response: "(x-2) cancels so it is just x+4, a line"
    scores: {cancels: 1, line: 1}
  - response: "because it has no vertical asymptote"
    scores: {cancels: 0, line: 0}
