# Rubric for homework item 4, are (x^2-1)/(x-1) and x+1 the same? (Unit 4, Lesson 4.1).
id: q4
points: 3
task: >-
  Are (x^2 - 1)/(x - 1) and x + 1 the same expression? Answer in terms of
  inputs: where do they agree, where do they disagree, and what is the graph
  of each?
criteria:
  - id: agree
    points: 1
    full: >-
      They agree at every input except x = 1, since
      (x^2 - 1)/(x - 1) = (x - 1)(x + 1)/(x - 1) = x + 1 for x not equal to 1.
  - id: disagree
    points: 1
    full: >-
      At x = 1 the first is undefined (0/0) while x + 1 equals 2.
  - id: graphs
    points: 1
    full: >-
      The graph of x + 1 is the whole line; the graph of (x^2 - 1)/(x - 1) is
      the same line with a hole at (1, 2).
examples:
  - response: >-
      They are equal except at x=1, where the fraction is undefined but x+1 is 2.
      So the fraction's graph is the line y=x+1 with a hole at (1,2).
    scores: {agree: 1, disagree: 1, graphs: 1}
  - response: "Yes, they are the same because the x-1 cancels."
    scores: {agree: 0, disagree: 0, graphs: 0}
