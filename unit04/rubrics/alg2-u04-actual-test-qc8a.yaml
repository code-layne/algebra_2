# Rubric for unit test Part C item 8(a), direct or inverse from a table (Unit 4).
id: qc8a
points: 1
task: >-
  The table gives x = 3, 4, 6, 12 with y = 24, 18, 12, 6. Is y directly or
  inversely proportional to x? Give the computation from the table that
  proves it.
criteria:
  - id: inverse-products
    points: 1
    full: >-
      Says inversely and shows the products are constant:
      3*24 = 4*18 = 6*12 = 12*6 = 72 (checking y/x first and finding it changes
      is fine, provided the products are then checked).
examples:
  - response: "inversely, xy is always 72"
    scores: {inverse-products: 1}
  - response: "inversely because y goes down"
    scores: {inverse-products: 0}
