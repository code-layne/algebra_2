# Rubric for unit test Part D item 1, the full analysis of (x^2-2x-3)/(x^2-9) (Unit 4).
id: qd1
points: 6
task: >-
  For f(x) = (x^2 - 2x - 3)/(x^2 - 9): (a) factor both parts and list every
  excluded value of the original function; (b) run the cancel test, name the
  hole and the vertical asymptote, give the hole's coordinates and explain how
  its height was found; (c) state the horizontal asymptote with a degree
  comparison and the end behavior; (d) give the x- and y-intercepts; (e) write
  the domain in interval notation; (f) a classmate says f is the same as
  (x + 1)/(x + 3): say exactly where they agree and where they do not.
criteria:
  - id: a-factor
    points: 1
    full: >-
      Both factorings, (x - 3)(x + 1)/((x - 3)(x + 3)), with both excluded
      values x = 3 and x = -3 from the original denominator.
  - id: b-cancel
    points: 2
    full: >-
      Hole at x = 3 and vertical asymptote at x = -3, with the height 2/3 taken
      from the simplified form: hole (3, 2/3). 1 point only if the two are
      named but the height is missing or computed from the original.
  - id: c-ha
    points: 1
    full: >-
      y = 1 with the degree comparison (equal degrees, ratio of leading
      coefficients 1/1), not just the answer.
  - id: d-intercepts
    points: 1
    full: Both intercepts, (-1, 0) and (0, 1/3).
  - id: e-domain
    points: 1
    full: >-
      The three-piece union (-inf, -3) U (-3, 3) U (3, inf); a single interval
      or a missing x != 3 loses it. Part (f) (they agree everywhere except
      x = 3, where f is undefined) may be folded into (b)/(e) credit.
examples:
  - response: >-
      (x-3)(x+1)/((x-3)(x+3)), excluded 3 and -3. Hole at x=3, VA x=-3, hole
      height (3+1)/(3+3)=2/3. HA y=1 since degrees equal. x-int (-1,0), y-int
      (0,1/3). Domain (-inf,-3)U(-3,3)U(3,inf). They agree except at x=3.
    scores: {a-factor: 1, b-cancel: 2, c-ha: 1, d-intercepts: 1, e-domain: 1}
  - response: >-
      Excluded 3, -3. Hole at 3, asymptote at -3. HA y=1. Domain all reals
      except -3. They are the same function.
    scores: {a-factor: 0, b-cancel: 1, c-ha: 0, d-intercepts: 0, e-domain: 0}
