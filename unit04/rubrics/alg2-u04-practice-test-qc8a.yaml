# Rubric for practice test Part C item 8(a), direct or inverse from a table (Unit 4).
id: qc8a
points: 1
task: >-
  The table gives x = 2, 4, 5, 10 with y = 30, 15, 12, 6. Is y directly or
  inversely proportional to x? Give the computation from the table that
  proves it.
criteria:
  - id: inverse-products
    points: 1
    full: >-
      Says inversely and shows the products are constant:
      2*30 = 4*15 = 5*12 = 10*6 = 60 (checking y/x first and finding it changes
      is fine, provided the products are then checked).
examples:
  - response: "inversely, xy is always 60"
    scores: {inverse-products: 1}
  - response: "inversely because y goes down"
    scores: {inverse-products: 0}
