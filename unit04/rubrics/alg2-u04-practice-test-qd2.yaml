# Rubric for practice test Part D item 2, average cost per shirt A(n) = (7n+180)/n (Unit 4).
id: qd2
points: 6
task: >-
  A club pays a $180 setup fee plus $7 per shirt; the average cost per shirt
  for n shirts is A(n) = (7n + 180)/n. (a) Explain why A is rational and state
  the sensible domain; (b) find A(20) and A(60) with units and say what is
  happening to the average cost; (c) rewrite A(n) as 7 + 180/n, state the
  horizontal asymptote and what it means; (d) find the order size with an
  average cost of exactly $9; (e) can the average cost ever be exactly $7?
criteria:
  - id: a-rational
    points: 1
    full: >-
      A quotient of two polynomials (rational) and a context domain of positive
      whole numbers n = 1, 2, 3, ...
  - id: b-values
    points: 1
    full: >-
      A(20) = $16 per shirt and A(60) = $10 per shirt, with dollar units, and
      the observation that the average cost is falling.
  - id: c-asymptote
    points: 2
    full: >-
      The rewrite 7 + 180/n and y = 7 interpreted as the true per-shirt
      printing cost (1 point for y = 7 alone).
  - id: d-ninety
    points: 1
    full: n = 90 shirts (from 7n + 180 = 9n).
  - id: e-never
    points: 1
    full: >-
      No, justified by 180/n > 0 for every positive n (or by the asymptote
      never being reached); "because it's an asymptote" with no reason earns 0.
examples:
  - response: >-
      Polynomial over polynomial, n = 1, 2, 3... A(20)=16, A(60)=10 dollars per
      shirt, going down. 7 + 180/n so HA y=7, the cost of printing one shirt.
      n=90. No, 180/n is always positive so A is always more than 7.
    scores: {a-rational: 1, b-values: 1, c-asymptote: 2, d-ninety: 1, e-never: 1}
  - response: "A(20)=16, A(60)=10. HA is 7. n=90. No because it is an asymptote."
    scores: {a-rational: 0, b-values: 0, c-asymptote: 1, d-ninety: 1, e-never: 0}
