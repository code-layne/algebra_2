# Rubric for practice test Part D item 1, the full analysis of (x^2-5x+4)/(x^2-16) (Unit 4).
id: qd1
points: 6
task: >-
  For f(x) = (x^2 - 5x + 4)/(x^2 - 16): (a) factor both parts and list every
  excluded value of the original function; (b) run the cancel test, name the
  hole and the vertical asymptote, give the hole's coordinates and explain how
  its height was found; (c) state the horizontal asymptote with a degree
  comparison and the end behavior; (d) give the x- and y-intercepts; (e) write
  the domain in interval notation; (f) a classmate says f is the same as
  (x - 1)/(x + 4): say exactly where they agree and where they do not.
criteria:
  - id: a-factor
    points: 1
    full: >-
      Both factorings, (x - 1)(x - 4)/((x - 4)(x + 4)), with both excluded
      values x = 4 and x = -4 from the original denominator.
  - id: b-cancel
    points: 2
    full: >-
      Hole at x = 4 and vertical asymptote at x = -4, with the height 3/8 taken
      from the simplified form: hole (4, 3/8). 1 point only if the two are
      named but the height is missing or computed from the original.
  - id: c-ha
    points: 1
    full: >-
      y = 1 with the degree comparison (equal degrees, ratio of leading
      coefficients 1/1), not just the answer.
  - id: d-intercepts
    points: 1
    full: Both intercepts, (1, 0) and (0, -1/4).
  - id: e-domain
    points: 1
    full: >-
      The three-piece union (-inf, -4) U (-4, 4) U (4, inf); a single interval
      or a missing x != 4 loses it. Part (f) (they agree everywhere except
      x = 4, where f is undefined) may be folded into (b)/(e) credit.
examples:
  - response: >-
      (x-1)(x-4)/((x-4)(x+4)), excluded 4 and -4. Hole at x=4, VA x=-4, hole
      height (4-1)/(4+4)=3/8. HA y=1 since degrees equal. x-int (1,0), y-int
      (0,-1/4). Domain (-inf,-4)U(-4,4)U(4,inf). They agree except at x=4.
    scores: {a-factor: 1, b-cancel: 2, c-ha: 1, d-intercepts: 1, e-domain: 1}
  - response: >-
      Excluded 4, -4. Hole at 4, asymptote at -4. HA y=1. Domain all reals
      except -4. They are the same function.
    scores: {a-factor: 0, b-cancel: 1, c-ha: 0, d-intercepts: 0, e-domain: 0}
