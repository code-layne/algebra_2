# Rubric for homework item 4, crossing horizontal vs vertical asymptotes (Unit 4, Lesson 4.0).
id: q4
points: 3
task: >-
  A graph may cross its horizontal asymptote, but it can never cross a
  vertical asymptote. Explain the difference.
criteria:
  - id: vertical
    points: 1
    full: >-
      Explains that a vertical asymptote sits at an excluded input (the
      denominator is zero there), so the graph has no point at that x-value
      and cannot cross it.
  - id: horizontal
    points: 1
    full: >-
      Explains that a horizontal asymptote only describes the outputs at the
      far ends (end behavior) and excludes no value.
  - id: contrast
    points: 1
    full: >-
      Concludes that in the middle of the graph an output may equal the
      horizontal asymptote's value, so the curve can pass through that line
      (input restriction vs description of outputs).
examples:
  - response: >-
      At a vertical asymptote x is not allowed, so there is no point there.
      The horizontal one is just where y goes as x gets huge, so the graph can
      hit that y-value in the middle.
    scores: {vertical: 1, horizontal: 1, contrast: 1}
  - response: "Because the vertical one is undefined."
    scores: {vertical: 1, horizontal: 0, contrast: 0}
