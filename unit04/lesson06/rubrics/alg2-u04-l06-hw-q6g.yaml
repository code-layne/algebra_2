# Rubric for homework item 6(c), what a 4 mph current would do (Unit 4, Lesson 4.6).
id: q6g
points: 2
task: >-
  A kayaker paddles at 4 mph in still water; upstream against a current of c
  mph, 6 miles takes 6/(4 - c) hours. In plain words, what would a current of
  exactly 4 mph do to the upstream leg, and how does the graph of the upstream
  time show it?
criteria:
  - id: words
    points: 1
    full: >-
      The current would exactly cancel her paddling, so she never moves
      upstream (the time is undefined / never finishes).
  - id: graph
    points: 1
    full: The graph of 6/(4 - c) has a vertical asymptote at c = 4.
examples:
  - response: "she would stand still and never get there; the graph has a vertical asymptote at c=4"
    scores: {words: 1, graph: 1}
  - response: "she goes 8 mph"
    scores: {words: 0, graph: 0}
