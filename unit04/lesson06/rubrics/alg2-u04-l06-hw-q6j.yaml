# Rubric for homework item 6(e), rejecting c = -2 (Unit 4, Lesson 4.6).
id: q6j
points: 3
task: >-
  The kayak equation 6/(4 - c) + 6/(4 + c) = 4 has candidates c = 2 and
  c = -2, neither extraneous. You must still reject one of them. Which, and
  why? Is your reason the same kind of reason as "extraneous"?
criteria:
  - id: which
    points: 1
    full: Rejects c = -2.
  - id: why
    points: 1
    full: A current speed cannot be negative (a context rejection).
  - id: kind
    points: 1
    full: >-
      Not the same kind: c = -2 really satisfies the equation, while an
      extraneous root satisfies only the cleared equation and makes the
      original undefined.
examples:
  - response: >-
      c=-2, the current can't be negative. That's not extraneous because -2
      does work in the equation; it just doesn't make sense.
    scores: {which: 1, why: 1, kind: 1}
  - response: "-2 because it is extraneous"
    scores: {which: 1, why: 0, kind: 0}
