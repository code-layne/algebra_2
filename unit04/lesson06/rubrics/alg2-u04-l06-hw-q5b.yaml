# Rubric for homework item 5(a), describing the student's broken LCD step (Unit 4, Lesson 4.6).
id: q5b
points: 2
task: >-
  A student solved 10/x - 4/(x - 1) = 1 by multiplying "the fractions" by the
  LCD x(x - 1), getting 10(x - 1) - 4x = 1. The error is in the
  multiply-by-the-LCD step. Describe it in a few words.
criteria:
  - id: fractions-only
    points: 1
    full: The student multiplied only the two fractions by the LCD.
  - id: both-sides
    points: 1
    full: >-
      Every term on both entire sides must be multiplied, including the 1 on
      the right (which should become x(x - 1)).
examples:
  - response: "they only multiplied the fractions and not the 1 on the right side"
    scores: {fractions-only: 1, both-sides: 1}
  - response: "wrong LCD"
    scores: {fractions-only: 0, both-sides: 0}
