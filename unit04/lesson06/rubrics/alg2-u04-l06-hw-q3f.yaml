# Rubric for homework item 3, check a candidate and give the reason (Unit 4, Lesson 4.6).
id: q3f
points: 1
task: >-
  Check, do not solve: 5/(x + 1) = (x + 3)/(x + 1), candidate x = 2 (a solution). Give the reason.
criteria:
  - id: reason
    points: 1
    full: >-
      Shows both sides equal 5/3 at x = 2 and notes 2 is not an excluded value (x != -1).
examples:
  - response: "both sides are 5/3 and 2 isn't -1"
    scores: {reason: 1}
  - response: "because it is positive"
    scores: {reason: 0}
