# Rubric for homework item 3, check a candidate and give the reason (Unit 4, Lesson 4.6).
id: q3d
points: 1
task: >-
  Check, do not solve: 3/x - 1/(x - 2) = 1/x, candidate x = 4 (a solution). Give the reason.
criteria:
  - id: reason
    points: 1
    full: >-
      Shows the check works (3/4 - 1/2 = 1/4) and notes 4 is not an excluded value.
examples:
  - response: "3/4 - 1/2 = 1/4 and 4 is not 0 or 2"
    scores: {reason: 1}
  - response: "it is a solution"
    scores: {reason: 0}
