# Rubric for homework item 3, check a candidate and give the reason (Unit 4, Lesson 4.6).
id: q3b
points: 1
task: >-
  Check, do not solve: (x + 2)/(x - 4) = 6/(x - 4), candidate x = 4 (not a solution). Give the reason.
criteria:
  - id: reason
    points: 1
    full: >-
      States that x = 4 makes x - 4 = 0, so both sides are undefined: the candidate is extraneous.
examples:
  - response: "x-4 is 0 so it is undefined"
    scores: {reason: 1}
  - response: "it doesn't work"
    scores: {reason: 0}
