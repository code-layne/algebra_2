# Rubric for homework item 2, two kinds of "no solution" (Unit 4, Lesson 4.6).
id: q2s
points: 2
task: >-
  x/(x - 6) = 6/(x - 6) + 2 and 4/(x^2 - 16) + 1/(x + 4) = 1/(x - 4) both come
  out to "no solution", but for two different reasons. Explain the difference.
criteria:
  - id: extraneous
    points: 1
    full: >-
      In (d) the cleared equation gives the candidate x = 6, which is rejected
      because 6 is an excluded value: an extraneous solution.
  - id: no-candidate
    points: 1
    full: >-
      In (f) the cleared equation reduces to a false statement (0 = 4), so there
      is no candidate at all and nothing is extraneous.
examples:
  - response: >-
      In (d) you get x=6 but it makes the denominator 0 so it is extraneous. In
      (f) you get 0=4, which is never true, so there was nothing to check.
    scores: {extraneous: 1, no-candidate: 1}
  - response: "both are extraneous"
    scores: {extraneous: 0, no-candidate: 0}
