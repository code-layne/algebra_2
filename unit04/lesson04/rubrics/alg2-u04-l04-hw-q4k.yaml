# Rubric for homework item 4, why the two horizontal-asymptote methods must agree (Unit 4, Lesson 4.4).
id: q4k
points: 2
task: >-
  After rewriting (x + 5)/(x + 2), (4x - 3)/(x - 1) and 2x/(x + 4) in the form
  a/(x - h) + k, the horizontal asymptotes y = k agree with the degree
  comparison from Lesson 4.0. Why must they agree?
criteria:
  - id: ratio
    points: 1
    full: >-
      Says the leftover constant k after the rewrite is the ratio of the
      leading coefficients (equal degrees give y = leading coefficient ratio).
  - id: same-function
    points: 1
    full: >-
      Says both methods describe the same function's end behavior: as x grows,
      a/(x - h) goes to 0, leaving y = k, which is what the degree rule
      predicts.
examples:
  - response: >-
      the number left over is the leading coefficient ratio, and a/(x-h) goes
      to 0 at the ends, so both give the same y
    scores: {ratio: 1, same-function: 1}
  - response: "because they are the same"
    scores: {ratio: 0, same-function: 0}
