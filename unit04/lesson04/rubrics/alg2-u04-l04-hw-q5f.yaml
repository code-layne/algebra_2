# Rubric for homework item 5(c), features of y = 12/x that y = 3x lacks (Unit 4, Lesson 4.4).
id: q5f
points: 2
task: >-
  Table I comes from y = 12/x and Table II from the linear function y = 3x.
  Give two features the graph of Table I's function has that Table II's does
  not.
criteria:
  - id: feature1
    points: 1
    full: >-
      Gives one correct feature: asymptotes (x = 0 and y = 0), a restricted
      domain (x != 0), two branches, or no intercepts.
  - id: feature2
    points: 1
    full: Gives a second, different correct feature from the same list.
examples:
  - response: "it has asymptotes and two branches"
    scores: {feature1: 1, feature2: 1}
  - response: "it is a curve and it goes down"
    scores: {feature1: 0, feature2: 0}
