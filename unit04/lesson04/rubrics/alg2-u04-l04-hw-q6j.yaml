# Rubric for homework item 6(c), meaning of the horizontal asymptote y = 1 (Unit 4, Lesson 4.4).
id: q6j
points: 2
task: >-
  A player has made 12 of 20 free throws and then makes x in a row, so her
  percentage is P(x) = (12 + x)/(20 + x), with horizontal asymptote y = 1.
  What does the asymptote mean about this player?
criteria:
  - id: approach
    points: 1
    full: >-
      Her percentage climbs toward 100% (1) as she keeps making shots.
  - id: never
    points: 1
    full: >-
      It never reaches 100%, because the 8 misses stay in the record.
examples:
  - response: "she gets closer and closer to 100% but can never get there since she missed 8"
    scores: {approach: 1, never: 1}
  - response: "she makes 100%"
    scores: {approach: 0, never: 0}
