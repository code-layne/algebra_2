# Rubric for homework item 2, which function has no x-intercept and why (Unit 4, Lesson 4.4).
id: q2y
points: 2
task: >-
  Of g(x) = 4/(x - 1) - 2, p(x) = -6/(x + 3) + 3 and q(x) = 1/(x + 5), which
  one has no x-intercept, and what is it about its equation that guarantees
  that?
criteria:
  - id: which
    points: 1
    full: Names q(x) = 1/(x + 5), part (c).
  - id: why
    points: 1
    full: >-
      Explains that its k is 0, so its horizontal asymptote is the x-axis
      (y = 0), and 1/(x + 5) = 0 is impossible (a fraction with numerator 1 is
      never 0).
examples:
  - response: "(c), because the HA is y=0 and 1/(x+5) can never equal 0"
    scores: {which: 1, why: 1}
  - response: "q(x) because it has no k"
    scores: {which: 1, why: 0}
