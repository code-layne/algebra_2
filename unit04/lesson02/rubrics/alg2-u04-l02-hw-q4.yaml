# Rubric for homework item 4, is the quotient the same as (x-3)/(x-2)? (Unit 4, Lesson 4.2).
id: q4
points: 3
task: >-
  Are ((x + 1)/(x - 2)) divided by ((x + 1)/(x - 3)) and (x - 3)/(x - 2) the
  same expression? Answer in terms of inputs: where do they agree, where do
  they disagree, and what does each graph look like?
criteria:
  - id: agree
    points: 1
    full: >-
      Keep-change-flip gives (x + 1)/(x - 2) times (x - 3)/(x + 1) = (x - 3)/(x - 2),
      so they agree at every input both accept.
  - id: disagree
    points: 1
    full: >-
      The quotient also excludes x = 3 (the divisor's denominator) and x = -1
      (the divisor's numerator), where (x - 3)/(x - 2) is defined.
  - id: graphs
    points: 1
    full: >-
      The quotient's graph is the graph of (x - 3)/(x - 2) with two extra holes,
      at (3, 0) and (-1, 4/3).
examples:
  - response: >-
      They simplify to the same thing, but the division also can't use x=3 or
      x=-1, so its graph is the same curve with holes at (3,0) and (-1,4/3).
    scores: {agree: 1, disagree: 1, graphs: 1}
  - response: "Yes, they are equal after you flip and cancel."
    scores: {agree: 1, disagree: 0, graphs: 0}
