# Rubric for homework item 1, where the restrictions in part (c) come from (Unit 4, Lesson 4.2).
id: q1g
points: 2
task: >-
  In (7x^2 y / 2) divided by (14 x y^3 / 5), neither original denominator can
  ever be zero. So where did the restrictions x != 0 and y != 0 come from?
criteria:
  - id: source
    points: 1
    full: >-
      Names the divisor's numerator, 14xy^3, as the source of the restrictions.
  - id: reason
    points: 1
    full: >-
      Explains that dividing flips the divisor, so 14xy^3 moves to the
      denominator (equivalently, you cannot divide by an expression equal to
      zero).
examples:
  - response: "from 14xy^3, because when you flip it goes on the bottom"
    scores: {source: 1, reason: 1}
  - response: "from the denominators"
    scores: {source: 0, reason: 0}
