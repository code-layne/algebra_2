# Rubric for homework item 3(b), why the rectangle's area keeps x != -5 (Unit 4, Lesson 4.2).
id: q3c
points: 2
task: >-
  A rectangle has width 2x/(x + 5) and length (x^2 + 5x)/4. Its area
  simplifies to x^2/2, which has no denominator containing x. Explain why the
  restriction x != -5 still belongs to the area.
criteria:
  - id: width
    points: 1
    full: >-
      Says that at x = -5 the width 2x/(x + 5) is undefined (has no value).
  - id: area
    points: 1
    full: >-
      Concludes that with no width there is no rectangle, so the area cannot
      be evaluated there; the simplified form keeps the restriction of the
      original expression.
examples:
  - response: "at x=-5 the width has no value, so there is no rectangle to measure"
    scores: {width: 1, area: 1}
  - response: "because x^2/2 can't be -5"
    scores: {width: 0, area: 0}
