# Rubric for homework item 5(d), why 12 mi/h is not the average of 10 and 15 (Unit 4, Lesson 4.3).
id: q5i
points: 2
task: >-
  A cyclist rides 30 miles out at 10 mi/h and 30 miles back at 15 mi/h. The
  average speed for the trip is 12 mi/h, not 12.5 (the average of 10 and 15).
  Explain in one sentence why.
criteria:
  - id: time
    points: 1
    full: >-
      Notes that the rider spends more time at the slower speed (3 hours at
      10 mi/h vs 2 hours at 15 mi/h).
  - id: weight
    points: 1
    full: >-
      Concludes that the slower speed therefore counts for more in the average
      (average speed is total distance over total time, not the mean of the
      speeds).
examples:
  - response: "you spend more time going slow, so the slow speed counts more"
    scores: {time: 1, weight: 1}
  - response: "because 12 is less than 12.5"
    scores: {time: 0, weight: 0}
