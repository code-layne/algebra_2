# Rubric for homework item 1, what the restrictions do to the graph (Unit 4, Lesson 4.3).
id: q1g
points: 2
task: >-
  3x/(x + 7) + 21/(x + 7) simplifies to 3 (x != -7), and x^2/(x + 5) - 25/(x + 5)
  simplifies to x - 5 (x != -5). Neither answer has a denominator left. So
  what does each restriction do to the graph?
criteria:
  - id: hole
    points: 1
    full: >-
      Says each restriction punches a hole (a single missing point) in the
      graph, not an asymptote.
  - id: where
    points: 1
    full: >-
      Locates the holes: (a) is the horizontal line y = 3 missing (-7, 3); (c)
      is the line y = x - 5 missing (-5, -10).
examples:
  - response: "it makes a hole, at (-7,3) in a and (-5,-10) in c"
    scores: {hole: 1, where: 1}
  - response: "it makes a vertical asymptote"
    scores: {hole: 0, where: 0}
