# Rubric for homework item 6, two pairs of expressions: same or not? (Unit 4, Lesson 4.3).
id: q6
points: 4
task: >-
  Are 1/(x - 2) + 1/(x + 2) and 2x/(x^2 - 4) the same expression? Then answer
  the same question for 3/(x - 3) - 18/(x^2 - 9) and 3/(x + 3). Answer both in
  terms of inputs: which inputs does each form accept, and where do they agree?
criteria:
  - id: pair1-combine
    points: 1
    full: >-
      First pair: combining gives exactly 2x/(x^2 - 4), so the forms agree.
  - id: pair1-domain
    points: 1
    full: >-
      Both forms of the first pair accept every input except x = 2 and x = -2,
      so they are fully equivalent.
  - id: pair2-domain
    points: 1
    full: >-
      Second pair: they agree at every input both accept, but 3/(x + 3) also
      accepts x = 3 (giving 1/2) while the difference does not.
  - id: pair2-graph
    points: 1
    full: >-
      Concludes the second pair is not interchangeable: as functions one has a
      hole at (3, 1/2) and the other does not.
examples:
  - response: >-
      The first two are the same, both exclude 2 and -2. The second pair agree
      except at x=3, where the difference is undefined but 3/(x+3) = 1/2, so
      one graph has a hole at (3, 1/2).
    scores: {pair1-combine: 1, pair1-domain: 1, pair2-domain: 1, pair2-graph: 1}
  - response: "Both pairs are the same because they simplify to each other."
    scores: {pair1-combine: 1, pair1-domain: 0, pair2-domain: 0, pair2-graph: 0}
