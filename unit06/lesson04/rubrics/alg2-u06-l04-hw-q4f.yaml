# Rubric for homework item 4(d) (Unit 6, Lesson 6.4).
id: q4f
points: 1
task: >-
  To find when $800 at 6% compounded annually doubles you must solve
  (1.06)^t = 2. Try Step 1 of Lesson 6.3 (rewrite both sides over a common base)
  on it. What stops you?
criteria:
  - id: base
    points: 1
    full: >-
      There is no common base - 2 is not a power of 1.06. (Saying the equation
      has "no solution" earns nothing.)
examples:
  - response: "you can't write 2 as 1.06 to a power, no common base"
    scores: {base: 1}
  - response: "there is no solution"
    scores: {base: 0}
