# Rubric for homework item 2, why continuous compounding gains so little (Unit 6, Lesson 6.4).
id: q2f
points: 2
task: >-
  $6000 at 4% for 10 years is worth $8933.18 compounded quarterly and $8950.95
  compounded continuously - only $17.77 more. Explain why that is so small when
  the compounding went from 40 times to infinitely many.
criteria:
  - id: diminishing
    points: 1
    full: >-
      Each extra compounding period adds less than the one before (diminishing
      returns).
  - id: ceiling
    points: 1
    full: >-
      The balances approach a ceiling (limit), P e^(rt), so compounding infinitely
      often is barely more than quarterly.
examples:
  - response: "More compounding adds less and less each time, the amounts level off at Pe^rt."
    scores: {diminishing: 1, ceiling: 1}
  - response: "because the rate is small"
    scores: {diminishing: 0, ceiling: 0}
