# Rubric for homework item 2(c) (Unit 6, Lesson 6.3).
id: q2i
points: 2
task: >-
  For the curve y = 2^x, explain why no horizontal line drawn below the x-axis
  will ever produce a solution of 2^x = (that height).
criteria:
  - id: range
    points: 1
    full: States that the range of y = 2^x is (0, infinity) - every output is positive.
  - id: asymptote
    points: 1
    full: >-
      Connects it to the graph - y = 0 is a horizontal asymptote, the curve stays
      above it, so it never meets a line below the x-axis.
examples:
  - response: "2^x is always positive, the graph stays above its asymptote y=0 so it never reaches y=-4"
    scores: {range: 1, asymptote: 1}
  - response: "because it is negative"
    scores: {range: 0, asymptote: 0}
