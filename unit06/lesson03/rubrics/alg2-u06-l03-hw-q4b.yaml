# Rubric for homework item 4(b), Elise's error (Unit 6, Lesson 6.3).
id: q4b
points: 3
task: >-
  Elise solved 9^(x+2) = 27 this way - "3^(2x+2) = 3^3, so 2x + 2 = 3 and
  x = 1/2." Name the error, then give the correct solution.
criteria:
  - id: error
    points: 1
    full: >-
      She did not distribute the 2 across x + 2 - (3^2)^(x+2) = 3^(2(x+2)) =
      3^(2x+4), not 3^(2x+2).
  - id: work
    points: 1
    full: Sets up the correct equation 2x + 4 = 3.
  - id: answer
    points: 1
    full: Gets x = -1/2.
examples:
  - response: "She only multiplied the x by 2. 3^(2x+4) = 3^3 so 2x+4 = 3, x = -1/2"
    scores: {error: 1, work: 1, answer: 1}
  - response: "she should have gotten 1"
    scores: {error: 0, work: 0, answer: 0}
