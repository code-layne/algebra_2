# Rubric for homework item 3, the two "no" equations (Unit 6, Lesson 6.3).
id: q3o
points: 2
task: >-
  2^x = 12 and 10^x = 45 cannot be solved by writing both sides over a common
  base. For each, does the equation still have a solution, and between which two
  whole numbers does it sit?
criteria:
  - id: two-to-the-x
    points: 1
    full: >-
      2^x = 12 has a solution between x = 3 and x = 4 (2^3 = 8, 2^4 = 16).
  - id: ten-to-the-x
    points: 1
    full: >-
      10^x = 45 has a solution between x = 1 and x = 2 (10^1 = 10, 10^2 = 100).
examples:
  - response: "yes both have one. 2^x=12 between 3 and 4, 10^x=45 between 1 and 2"
    scores: {two-to-the-x: 1, ten-to-the-x: 1}
  - response: "no solution for either"
    scores: {two-to-the-x: 0, ten-to-the-x: 0}
