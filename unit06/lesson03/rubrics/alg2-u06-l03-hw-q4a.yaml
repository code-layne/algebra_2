# Rubric for homework item 4(a), Jamal's error (Unit 6, Lesson 6.3).
id: q4a
points: 3
task: >-
  Jamal solved 8^x = 32 this way - "(2^3)^x = 2^5, so 2^(3+x) = 2^5, so 3 + x = 5
  and x = 2." Name the error, then give the correct solution.
criteria:
  - id: error
    points: 1
    full: >-
      A power of a power multiplies the exponents - (2^3)^x = 2^(3x), not
      2^(3+x); he added them (used the product rule).
  - id: work
    points: 1
    full: Sets up the correct equation 2^(3x) = 2^5, so 3x = 5.
  - id: answer
    points: 1
    full: Gets x = 5/3.
examples:
  - response: "He added the exponents, should multiply: 2^(3x) = 2^5, 3x = 5, x = 5/3"
    scores: {error: 1, work: 1, answer: 1}
  - response: "x = 5/3"
    scores: {error: 0, work: 0, answer: 1}
