# Rubric for homework item 5, one answer or two (Unit 6, Lesson 6.3).
id: q5c
points: 2
task: >-
  x^2 = 64 gives x = 8 or -8, while 2^x = 64 gives only x = 6. Explain the
  difference using the shape of each graph, not the algebra.
criteria:
  - id: parabola
    points: 1
    full: >-
      The parabola has a turning point (vertex) and is symmetric, so it reaches
      the height 64 on both sides - two inputs.
  - id: exponential
    points: 1
    full: >-
      The exponential has no turning point - it only increases (one-to-one), so
      it reaches the height 64 exactly once.
examples:
  - response: "The parabola goes down and back up so it hits 64 twice; 2^x always goes up so it only hits 64 once."
    scores: {parabola: 1, exponential: 1}
  - response: "because square roots have plus or minus"
    scores: {parabola: 0, exponential: 0}
