# Rubric for homework item 1, closing question (Unit 6, Lesson 6.3).
id: q1q
points: 2
task: >-
  Solving 2^x = 128, 3^(2x) = 81, 5^x = 1/25, 16^x = 64, (1/2)^x = 32,
  27^(x-1) = 9, 4^(x+2) = 8^x and 6^(3x) = sqrt(6), three of the eight answers
  are not whole numbers. List them, and say in one sentence why that is not a
  sign of a mistake.
criteria:
  - id: list
    points: 1
    full: Lists the three - (d) x = 3/2, (f) x = 5/3, (h) x = 1/6.
  - id: reason
    points: 1
    full: >-
      Explains that nothing requires a whole-number answer - the exponent is a
      position on the x-axis, and the curve can reach a given height at any real
      x (fractional exponents are legitimate).
examples:
  - response: "d, f, h (3/2, 5/3, 1/6). Exponents can be fractions, the graph can hit that height between whole numbers."
    scores: {list: 1, reason: 1}
  - response: "3/2 and 1/6 because I divided"
    scores: {list: 0, reason: 0}
