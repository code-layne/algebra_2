# Rubric for homework item 5, endpoint vs asymptote (Unit 6, Lesson 6.0).
id: q5
points: 3
task: >-
  y = sqrt(x) has an absolute minimum of 0 at its endpoint. y = 2^x also has a
  lowest edge at y = 0 but no absolute minimum. Explain the difference using the
  words endpoint, asymptote, and reaches.
criteria:
  - id: endpoint
    points: 1
    full: >-
      The endpoint (0, 0) is a point on the graph of y = sqrt(x) - the function
      reaches 0 (sqrt(0) = 0), so 0 is its absolute minimum.
  - id: asymptote
    points: 1
    full: >-
      y = 0 is an asymptote of y = 2^x - the graph only approaches it; no input
      makes 2^x equal 0, the outputs stay positive.
  - id: conclusion
    points: 1
    full: >-
      Concludes that because 0 is never reached (it is a boundary of the range
      (0, infinity), not an output), y = 2^x has no absolute minimum.
examples:
  - response: >-
      sqrt(x) has an endpoint at (0,0) so it reaches 0 and that is the min. 2^x
      has an asymptote at y=0, it never reaches 0, so there is no lowest value.
    scores: {endpoint: 1, asymptote: 1, conclusion: 1}
  - response: "one is a point and one is a line"
    scores: {endpoint: 0, asymptote: 0, conclusion: 0}
