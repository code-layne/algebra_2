# Rubric for homework item 4, table B reason (Unit 6, Lesson 6.0).
id: q4d
points: 1
task: >-
  Table B (x = 0,1,2,3,4; y = 5, 10, 20, 40, 80) is exponential. Give the
  constant that proves it.
criteria:
  - id: constant
    points: 1
    full: Names a constant ratio (common factor) of 2.
examples:
  - response: "each y is multiplied by 2"
    scores: {constant: 1}
  - response: "it grows fast"
    scores: {constant: 0}
