# Rubric for homework item 4, table C reason (Unit 6, Lesson 6.0).
id: q4f
points: 1
task: >-
  Table C (x = 0,1,2,3,4; y = 3, 4, 7, 12, 19) is quadratic. Give the constant
  that proves it.
criteria:
  - id: constant
    points: 1
    full: >-
      Says the first differences (1, 3, 5, 7) are not constant but the second
      differences are a constant +2.
examples:
  - response: "second differences are all 2"
    scores: {constant: 1}
  - response: "the ratio is not constant"
    scores: {constant: 0}
