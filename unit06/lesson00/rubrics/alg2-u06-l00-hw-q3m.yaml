# Rubric for homework item 3, last part (Unit 6, Lesson 6.0).
id: q3m
points: 2
task: >-
  m(x) = 4 * 2^x and n(x) = 9 * (1/3)^x have the same horizontal asymptote y = 0.
  Which side does each graph approach it on, and what in the equation decides that?
criteria:
  - id: sides
    points: 1
    full: >-
      States that m approaches y = 0 on the left (as x goes to -infinity) and n
      approaches it on the right (as x goes to +infinity).
  - id: base
    points: 1
    full: >-
      Says the base b decides it - b > 1 (growth) approaches on the left,
      0 < b < 1 (decay) approaches on the right.
examples:
  - response: "m on the left, n on the right, because m's base is bigger than 1 and n's base is a fraction"
    scores: {sides: 1, base: 1}
  - response: "both approach y=0 because a is positive"
    scores: {sides: 0, base: 0}
