# Rubric for homework item 4, table A reason (Unit 6, Lesson 6.0).
id: q4b
points: 1
task: >-
  Table A (x = 0,1,2,3,4; y = 5, 8, 11, 14, 17) is linear. Give the constant
  that proves it.
criteria:
  - id: constant
    points: 1
    full: Names a constant difference (first difference) of +3.
examples:
  - response: "it adds 3 every time"
    scores: {constant: 1}
  - response: "it goes up"
    scores: {constant: 0}
