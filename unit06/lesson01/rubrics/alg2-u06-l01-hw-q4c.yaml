# Rubric for homework item 4(a), interpret C(6) (Unit 6, Lesson 6.1).
id: q4c
points: 2
task: >-
  A culture starts with 250 bacteria cells and the count increases by 40% every
  hour, C(t) = 250(1.4)^t and C(6) is about 1882. What does C(6) mean?
criteria:
  - id: time
    points: 1
    full: Ties the input to time - 6 hours after the culture was started.
  - id: value
    points: 1
    full: Ties the output to the quantity - about 1882 cells (bacteria).
examples:
  - response: "after 6 hours there are about 1882 bacteria"
    scores: {time: 1, value: 1}
  - response: "it is 1882"
    scores: {time: 0, value: 0}
