# Rubric for homework item 5(b), Priya's error (Unit 6, Lesson 6.1).
id: q5b
points: 3
task: >-
  "A colony of 250 bees grows 7% each week." Priya wrote P(w) = 250(0.07)^w.
  Name the error, say what her model actually describes, and write the correct
  model.
criteria:
  - id: error
    points: 1
    full: Names the error - she used the percent (rate) itself as the base.
  - id: meaning
    points: 1
    full: >-
      Says her model describes the colony keeping only 7% each week (a 93%
      decrease, decay).
  - id: model
    points: 1
    full: Writes the correct model P(w) = 250(1.07)^w.
examples:
  - response: >-
      She used 0.07 as the base, which means the bees drop to 7% every week (decay).
      Correct is P(w) = 250(1.07)^w.
    scores: {error: 1, meaning: 1, model: 1}
  - response: "P(w) = 250(1.07)^w"
    scores: {error: 0, meaning: 0, model: 1}
