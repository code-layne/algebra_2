# Rubric for homework item 5(a), Jonah's error (Unit 6, Lesson 6.1).
id: q5a
points: 3
task: >-
  "An $18,000 truck loses 15% of its value each year." Jonah wrote
  V(t) = 18,000(1.15)^t. Name the error, say what his model actually describes,
  and write the correct model.
criteria:
  - id: error
    points: 1
    full: >-
      Names the error - he added the rate instead of subtracting it (used 1 + r
      for a loss).
  - id: meaning
    points: 1
    full: Says his model describes the truck gaining (growing) 15% a year.
  - id: model
    points: 1
    full: Writes the correct model V(t) = 18,000(0.85)^t.
examples:
  - response: >-
      He added 15% instead of subtracting, so his truck gains 15% a year. It
      should be V(t) = 18000(0.85)^t.
    scores: {error: 1, meaning: 1, model: 1}
  - response: "it should be 0.85"
    scores: {error: 0, meaning: 0, model: 1}
