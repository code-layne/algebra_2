# Rubric for homework item 4(b), interpret V(4) (Unit 6, Lesson 6.1).
id: q4f
points: 2
task: >-
  A phone bought for $900 loses 22% of its value each year, V(t) = 900(0.78)^t
  and V(4) is about $333.14. What does V(4) mean?
criteria:
  - id: time
    points: 1
    full: Ties the input to time - 4 years after the phone was bought.
  - id: value
    points: 1
    full: Ties the output to the quantity - the phone is worth about $333.14.
examples:
  - response: "4 years after buying it the phone is worth $333.14"
    scores: {time: 1, value: 1}
  - response: "the phone lost $333"
    scores: {time: 0, value: 0}
