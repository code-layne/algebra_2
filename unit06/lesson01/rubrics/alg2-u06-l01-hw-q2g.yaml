# Rubric for homework item 2, table C (Unit 6, Lesson 6.1).
id: q2g
points: 2
task: >-
  Table C (x = 0,1,2,3,4; y = 2, 5, 8, 11, 14). Can it be modeled by y = ab^x?
  If not, say what family it belongs to and why.
criteria:
  - id: family
    points: 1
    full: Says it is not exponential - it is linear.
  - id: reason
    points: 1
    full: >-
      Gives the reason - the ratios (5/2, 8/5, 11/8) are not constant, while the
      differences are a constant +3 (y = 3x + 2 is a bonus, not required).
examples:
  - response: "not exponential, it's linear because it adds 3 each time"
    scores: {family: 1, reason: 1}
  - response: "exponential, it keeps going up"
    scores: {family: 0, reason: 0}
