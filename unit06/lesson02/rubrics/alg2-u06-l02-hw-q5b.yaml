# Rubric for homework item 5(b), Tara's claim (Unit 6, Lesson 6.2).
id: q5b
points: 2
task: >-
  Tara says y = -6^x and y = 6^(-x) are both decay functions "because of the
  negative." Fix both halves of that claim.
criteria:
  - id: outside
    points: 1
    full: >-
      y = -6^x - the negative is on the output, a reflection over the x-axis; the
      base is still 6, so it is still a growth function (not decay).
  - id: inside
    points: 1
    full: >-
      y = 6^(-x) - the negative is on the input, a reflection over the y-axis; it
      equals (1/6)^x, so it is decay.
examples:
  - response: >-
      -6^x is just flipped over the x-axis, base 6 so it is growth. 6^-x = (1/6)^x
      so that one really is decay.
    scores: {outside: 1, inside: 1}
  - response: "both are decay because they go down"
    scores: {outside: 0, inside: 0}
