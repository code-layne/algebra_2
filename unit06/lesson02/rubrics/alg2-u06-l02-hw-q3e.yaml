# Rubric for homework item 3, the two crossers (Unit 6, Lesson 6.2).
id: q3e
points: 2
task: >-
  Graphs W (y = 2^x + 1), X (y = 2^x - 4), Y (y = 2^(-x)) and Z (y = -2^x + 4)
  are drawn with their asymptotes. Two of the four graphs cross the x-axis. Name
  them, and give the x-intercept of each by reading the graph.
criteria:
  - id: names
    points: 1
    full: Names X and Z (both, and no others).
  - id: intercept
    points: 1
    full: Gives the x-intercept (2, 0) (or x = 2) for each of them.
examples:
  - response: "X and Z, both at (2,0)"
    scores: {names: 1, intercept: 1}
  - response: "X at (2,0) and W"
    scores: {names: 0, intercept: 0}
