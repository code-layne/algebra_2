# Rubric for homework item 5(a), Marcus's error (Unit 6, Lesson 6.2).
id: q5a
points: 3
task: >-
  Asked to describe y = 5^(x-2), Marcus wrote "The asymptote is y = -2 and the
  range is (-2, infinity)." Name the error, then give the correct answer.
criteria:
  - id: error
    points: 1
    full: >-
      Names the error - the -2 is inside the exponent (an input change), so it is
      a horizontal shift right 2, not a vertical shift.
  - id: asymptote
    points: 1
    full: Gives the correct asymptote y = 0.
  - id: range
    points: 1
    full: Gives the correct range (0, infinity).
examples:
  - response: "The -2 moves it right 2, not down. Asymptote y = 0, range (0, inf)."
    scores: {error: 1, asymptote: 1, range: 1}
  - response: "asymptote is y=2"
    scores: {error: 0, asymptote: 0, range: 0}
